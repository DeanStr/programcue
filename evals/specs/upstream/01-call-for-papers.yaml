      Use the bound portalUrl from CFP-S1; verify the record before continuing.


      ORIGINAL SCENARIO SCRIPT:

      9. Sign out. Load the public portal WITHOUT being logged in. Screenshot
      the
         page showing event branding/name, the submission deadline, and the form
         (or its start button).
      10. On the public form, open the track dropdown, the format dropdown, and
      the
         "Audience level" dropdown; screenshot each open so the options are visible
         (the three fixture tracks, the five fixture formats, and
         Beginner/Intermediate/Advanced). Then test the conditional field: select
         format "Workshop (120 min)" and screenshot showing "Workshop prerequisites"
         visible; switch to "Talk (30 min)" and screenshot showing it hidden. Record
         whether visibility changed without a full page reload. If the form cannot be
         interacted with while logged out (account required first), record that —
         these checks are repeated in CFP-S2 as the speaker.
      11. Attempt to submit (or advance past the page containing required
      fields) with
         "Key takeaway" and other required fields left empty. Screenshot the
         validation error. If the form requires creating an account before it can be
         filled, record that and leave validation testing to the speaker scenario.


      Missing optional features are findings: record them and continue the
      reachable script. Use feature_not_found for an absent core capability and
      blocked for unavailable access/evidence. Do not turn provider or
      evidence-tool failures into product verdicts.
    successSignals:
      - Public portal loads logged-out with event name and a visible deadline
      - Two screenshots proving the conditional field toggles with format
        selection
      - Validation error screenshot on empty required field
    dependsOn:
      - CFP-S1
    inputs:
      portalUrl:
        from: CFP-S1
        output: portalUrl
