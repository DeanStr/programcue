id: call-for-papers
title: Call for Papers
weight: 20
optional: false
description: >
  SessionBoard's Call for Papers module runs the submission side of the proposal
  lifecycle end-to-end. Organizers build a custom submission form (multiple
  field types, required flags, conditional logic keyed to track or session
  format), set open/close dates, and publish it on a branded public portal.
  Speakers create submitter accounts, optionally save drafts, submit proposals,
  receive on-screen and email confirmation, and can view and edit their
  submissions from a personal dashboard until the close date. Organizers assign
  committee reviewers, who score assigned submissions (rating plus comment) from
  an isolated reviewer dashboard; organizers then record accept/reject
  decisions, dispatch decision notification emails, and hand accepted talks off
  to the sessions/agenda area without re-entry. Review DEPTH (multi-round
  review, blind/anonymized review, weighted scorecards, aggregate score tables,
  bulk reviewer operations, exact reviewer-queue scoping, co-authors) is owned
  by the abstract-management spec and is deliberately not scored here. Note: a
  scenario's persona is its STARTING identity — scenarios may sign out and
  switch identities mid-run; the harness supplies all fixture credentials to
  every scenario.
scenarios:
  - id: CFP-S1
    name: Organizer builds and publishes the CFP
    kind: browser
    persona: organizer
    requiresAuth: true
    allowedPersonas:
      - organizer
      - speaker
      - reviewer
      - anonymous
    instructions: >-
      PROGRAMCUE EXECUTION ADAPTATION: Use the configured fixture identities and
      current saved persona. Replace every sign-out/sign-in role transition
      below with switch_persona. For public checks switch to anonymous. Never
      authenticate another identity in the current context. Do not repeat signup
      when already authenticated; explicitly distinguish pre-provisioned access
      from signup evidence.


      Run the chained suite in the new DevFlow Conf 2027 event created by
      CFP-S1, not the populated Future of Events 2027 showcase. After each
      switch_persona, explicitly select DevFlow Conf 2027 through the event
      picker when that role has event access; applicant pages use the observed
      bound CFP URL. Accept the invitation to this event before opening its
      reviewer workspace. Never substitute the showcase's form, schedule,
      reviews or published programme. Fixture emails override literal example
      addresses below. Record actual dates, track/format names and any
      substituted fixture values. Follow the original criterion: substitutions
      cannot hide a missing capability.


      At original steps 1-2, create a blank DevFlow Conf 2027 event using
      Program Cue as its data repository, the fixture dates and public slug
      devflow-conf-2027. Reuse the configured verified evaluation sender from
      the showcase event through the explicit Reuse verified sender choice when
      available; missing sender capability stays an honest provider blocker. Do
      not clone the showcase or archive its review cycle. If DevFlow Conf 2027
      already exists before this run, report blocked and request an
      operator-owned fresh fixture rather than reusing or clearing unknown work.
      Verify the new event has no proposals or existing review assignments
      before continuing; create its CFP with New form if needed. Before
      publishing the CFP, open Communications in this new event and create,
      save, preview and publish two active email templates: Submission
      confirmation and Decision (the actual categories, not Ad hoc or Task
      reminder). Use New template for each independent template; editing one
      published template creates a replacement version rather than a second
      template. Verify both template names remain Live after reload. Use
      explicit synthetic event copy. For these controlled evaluation messages,
      set the required footer to Evaluation fixture followed by the observed
      fixture event location, and record that synthetic footer value; this does
      not verify an organisation mailing address. Do not change the organisation
      postal address or provider credentials. Verify each published version and
      active status after reload. A verified sender alone is not template
      readiness. Missing required configuration is a setup blocker; do not claim
      a queued confirmation or decision email was delivered. This scenario owns
      original CFP-S1 steps 1–8 and 12. Anonymous steps 9–11 run separately in
      CFP-S1-PUBLIC; do not perform them here or treat their unavailable
      evidence as a publication failure. Verify the published version and
      publish portalUrl only from observed evidence. After the multi-event
      probe, restore the organizer's canonical event before finishing.
      Completion here proves neither anonymous access nor applicant validation.
      Program Cue applications intentionally allow one or more event tracks
      through the protected Tracks checkbox group; organisers confirm one
      programme track at acceptance. Select the requested fixture track using
      this control and verify its persisted value. Record the difference from
      the upstream track-dropdown request explicitly; do not replace the
      protected field, block the remaining workflow solely on its presentation,
      or claim that a dropdown was observed. Keep the upstream criterion text
      and grading unchanged. Continue to inspect the actual Format and Audience
      level dropdowns.


      ORIGINAL SCENARIO SCRIPT:

      1. Navigate to the app root. Find the organizer/admin entry point — try
      obvious
         routes (/admin, /dashboard, /organizer) and nav links ("Admin", "Dashboard",
         "Organizer", "Sign up", "Get started"). If open signup exists, sign up as the
         organizer identity Jordan Alvarez from the sample data; otherwise sign in with
         the organizer fixture credentials.
      2. Create the event "DevFlow Conf 2027" (2027-05-12 to 2027-05-14, Moscone
      West,
         San Francisco) if no event exists yet. If the clone is single-event or comes
         pre-seeded, use the existing event.
      3. Find the call-for-papers setup area — it may be called "Call for
      Papers",
         "CFP", "Submissions", "Submission form", "Forms", or "Apply". Screenshot it.
      4. Configure the three fixture tracks (AI Engineering, Platform & Infra,
         Developer Experience) and the five session formats exactly as labeled in the
         fixtures — "Keynote (45 min)", "Talk (30 min)", "Lightning Talk (10 min)",
         "Workshop (120 min)", "Panel (45 min)" — wherever tracks/formats are managed.
      5. In the form builder, ensure the form has at minimum: session title
      (required
         text), abstract (required long text), track (dropdown), format (dropdown),
         speaker bio (long text). Then ADD two custom fields: a required short-text
         field named "Key takeaway", and a dropdown named "Audience level" with options
         Beginner / Intermediate / Advanced. Screenshot the builder showing the added
         fields and their required/optional flags.
      6. Add a conditional field: a long-text field "Workshop prerequisites"
      configured
         to show only when the format answer is "Workshop (120 min)". If the builder
         has no conditional/show-when capability, record that observation explicitly
         and continue.
      7. Set the submission window: open now, close date 2027-04-30 (any clearly
      future
         date is acceptable). Screenshot the open/close date settings.
      8. Publish the CFP and capture the public portal URL (copy-link button,
      "View
         public form", or the visible address). Record the exact URL as an observation
         — later scenarios reuse it.
      12. MULTI-EVENT PROBE. Sign back in as the organizer and look for a way to
      run a
         SECOND event alongside the first: an events list, an event switcher, a
         "New event"/"Create event" control. If one exists, create a second event
         named "Forward Summit 2028" and screenshot it listed alongside the first.
         Then open the second event's submissions/abstracts area and screenshot it,
         confirming whether it is empty (data scoped per event) or shows the first
         event's submissions (data leaking across events). If NO way to create or
         switch events exists, record an explicit observation naming every place you
         looked and stating that the app appears to be single-event — do not skip
         this step silently.


      Publish the observed public CFP portal URL as portalUrl. Call
      publish_output with successful evidence step references. Use only ordinary
      non-secret HTTP(S) URLs. If it cannot be observed, report blocked; never
      invent a URL.


      Missing optional features are findings: record them and continue the
      reachable script. Use feature_not_found for an absent core capability and
      blocked for unavailable access/evidence. Do not turn provider or
      evidence-tool failures into product verdicts.
    successSignals:
      - Builder screenshot shows "Key takeaway" (required) and "Audience level"
        dropdown
      - Recorded observation of the public portal URL
    dependsOn: []
    outputs:
      portalUrl:
        type: url
