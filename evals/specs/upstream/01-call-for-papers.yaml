      Before assigning any reviews, name the initial round CFP Review (create or
      edit the still-unassigned round). Keep its original numeric scorecard.
      Sam's saved identity grants no reviewer membership. Perform Jordan's
      invitation, then switch to reviewer and explicitly accept the pending
      invitation. Capture both states. Do not publish invitation or magic-link
