      Use the bound portalUrl from CFP-S1; verify the record before continuing.


      ORIGINAL SCENARIO SCRIPT:

      1. Open the public CFP portal (the URL recorded in CFP-S1; otherwise find
      it from
         the app's public homepage — look for "Submit a talk", "Call for Papers",
         "CFP", "Apply", or "Submissions").
      2. Create a submitter account as the speaker identity Priya Raman from the
      sample
         data (signup may happen before the form or as part of submitting). Screenshot
         the signup/login step.
      3. Draft test: start a new submission and enter ONLY the title "Taming
      40-Minute
         CI: Incremental Builds at Monorepo Scale". Look for a "Save as draft" /
         "Save draft" / "Save and finish later" control and use it. Screenshot any
         draft banner/indicator. Navigate away (or sign out and back in), return to the
         form, and verify the draft is offered for resume or the title is pre-filled;
         screenshot that. If no draft capability exists, record its absence and
         continue with a fresh submission.
      4. Before completing the form, attempt to submit/advance with the abstract
      and
         "Key takeaway" empty; screenshot the required-field validation error.
      5. If CFP-S1 could not exercise the public form logged-out (account
      required
         first), run the deferred checks here before filling in: screenshot the open
         track, format, and "Audience level" dropdowns showing their options, then
         select format "Workshop (120 min)" and screenshot "Workshop prerequisites"
         visible, switch to "Talk (30 min)" and screenshot it hidden.
      6. Complete the full "Taming 40-Minute CI" proposal from the sample data:
         abstract, track "Platform & Infra", format "Talk (30 min)", audience level
         "Intermediate", speaker bio from Priya's fixture bio, and for "Key takeaway"
         enter "A decision framework for which incremental-build investments pay off".
         Screenshot the filled form, then submit.
      7. Screenshot the confirmation state (confirmation page, banner, or
      thank-you
         message). Record its exact wording, including any mention that a confirmation
         email was sent.
      8. Find the submitter dashboard — "My submissions", "My sessions", "My
      proposals"
         — and verify the proposal is listed with a status label (e.g. Submitted /
         Under Review / Pending). Screenshot the dashboard row and record the status
         text.
      9. Edit test: open the submission from the dashboard (look for an Edit or
      "View
         Submission" affordance), append the sentence "Updated: now includes 2026
         benchmark data." to the end of the abstract, and save. Reload the page and
         reopen the submission; screenshot proving the appended sentence persisted.
      10. Submit a second complete proposal from the sample data: "Your AI Pair
         Programmer Is Lying to You: Verification Patterns That Scale" (track
         "AI Engineering", format "Talk (30 min)", audience level "Advanced"). For
         "Key takeaway" enter "Verification patterns that scale beyond code review".
      11. Screenshot the submitter dashboard showing BOTH proposals listed with
         statuses.


      Checkpoint evidence is immutable. Finish every observation required by a
      declared check before publishing it. After mutations, wait for the UI to
      settle and reload where persistence is required; take a fresh snapshot and
      screenshots with the relevant values visible (scroll or open the specific
      record when needed). Cite the successful screenshot steps themselves as
      well as useful snapshot steps using step:N; screenshots taken at other
      steps are outside that checkpoint. Large snapshot excerpts may be
      truncated, so retain readable screenshots of the actual results. Do not
      cite observe notes, a click alone, failed tools or planned future
      captures. Publish each checkpoint once, immediately after gathering its
      complete evidence, and verify the call succeeds. A checkpoint records
      reach, never success; missing or failing product behavior can be
      evidenced, but leave unexercised checks unpublished. For submitted, retain
      the confirmation and the saved dashboard row; for edited, retain the
      edited abstract after reload. Fixture activation is not signup or
      email-verification evidence.


      After completing the speaker checks and recording the submitted/edited
      checkpoints, switch_persona to organizer. In the canonical event's
      Applications queue, open the CI proposal and verify its title and revised
      abstract. Publish that observed authenticated organiser detail URL
      (/admin/submissions/:submissionId) as proposalUrl for CFP-S3. This is an
      ordinary record route requiring organiser access, not a credential or
      capability link. Submission IDs are opaque and retain their draft- prefix
      after submission; a detail URL such as
      /admin/submissions/draft-<opaque-id>?queue=1 is valid when it is the exact
      observed organiser record. The queue query only preserves navigation
      context; it does not make a detail route the queue itself. Copy the
      observed URL including its query. Do not use /apply/...?...draft=...
      applicant links, construct a URL from a record ID, or substitute
      /admin/submissions without a record ID. Only claim publication after
      publish_output returns success. If verification or output recording fails,
      preserve that failure and report the handoff blocked without claiming it
      was published. Call publish_output with successful evidence step
      references. Use only ordinary non-secret HTTP(S) URLs. If it cannot be
      observed, report blocked; never invent a URL.


      Missing optional features are findings: record them and continue the
      reachable script. Use feature_not_found for an absent core capability and
      blocked for unavailable access/evidence. Do not turn provider or
      evidence-tool failures into product verdicts.
    successSignals:
      - Draft indicator and resumed-draft screenshots (or recorded absence)
      - Filled form screenshot before submitting and the confirmation state after
      - Dashboard listing both submissions with status labels
      - Persisted edited abstract containing the "Updated:" sentence
    dependsOn:
      - CFP-S1
    outputs:
      proposalUrl:
        type: url
    inputs:
      portalUrl:
        from: CFP-S1
        output: portalUrl
    checkpoints:
      submitted: The submission confirmation and saved dashboard row were inspected.
      edited: The edited abstract was inspected after reload.
