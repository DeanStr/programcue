      track, including any missing transferred fields. For closed, capture the
      public closed state and actually attempt the speaker edit. Preserve the
      speaker's editability before closure too; distinguish an existing
      decision/review lock from a lock caused by closure. Capture disabled
      fields and the actual explanation. Do not infer closure caused a
      pre-existing lock.


      Publish the accepted CI session's ordinary admin detail URL as sessionUrl.
      Call publish_output with successful evidence step references. Use only
      ordinary non-secret HTTP(S) URLs. If it cannot be observed, report
      blocked; never invent a URL.


      Missing optional features are findings: record them and continue the
      reachable script. Use feature_not_found for an absent core capability and
      blocked for unavailable access/evidence. Do not turn provider or
      evidence-tool failures into product verdicts.
    successSignals:
      - Organizer view of the recorded review (rating 4 + comment)
      - Submissions list with one Accepted and one Rejected status
      - Notification send confirmation (or recorded absence)
      - Session in the agenda area matching the accepted talk's metadata
      - Public portal in closed state; speaker-side statuses updated and editing
        locked
    dependsOn:
      - CFP-S3
      - ABS-S3
    outputs:
      sessionUrl:
        type: url
    checkpoints:
      decisions: Both persisted organizer decision statuses were inspected.
      handoff: The accepted session and transferred metadata were inspected.
      closed: The public closed state and speaker edit lock were exercised.
rubric:
  - id: CFP-01
    criterion: Organizer can build a custom submission form — adding fields of at
      least 3 types (short text, long text, dropdown) with required/optional
      flags — and the changes render on the public form with required-field
      validation enforced
    weight: 3
    tags:
      - crud
    scenarios:
      - CFP-S1
      - CFP-S1-PUBLIC
      - CFP-S2
    grader:
      type: llm
    passCriteria: The added fields ('Key takeaway' required text, 'Audience level'
      dropdown with 3 options) appear on the public form with correct types and
      options, and attempting to submit with a required field empty is blocked
      with a visible validation error
    evidence: Builder screenshot showing the added fields and required flags;
      public-form screenshot showing them rendered; screenshot of a validation
      error on an empty required field (from S1 logged-out or S2 as the speaker)
  - id: CFP-02
    criterion: "Submission form supports conditional logic: a field configured to
      show only for a given session format (or track) appears and disappears
      based on the submitter's selection"
    weight: 1
    tags:
      - depth
    scenarios:
      - CFP-S1
      - CFP-S1-PUBLIC
      - CFP-S2
    grader:
      type: llm
    passCriteria: A field configured to depend on the session format appears for the
      workshop-style format and disappears for the talk-style format —
      visibility follows the controlling answer in both directions. The app's
      own format vocabulary counts (e.g. 'Workshop' / 'Break Out'); the
      fixture's duration-labelled names are illustrative, not required
    evidence: Two public-form screenshots, one per format selection, showing the
      dependent field present then absent (from CFP-S1 logged-out, or CFP-S2 as
      the speaker if the form requires an account first); builder screenshot of
      the show-when configuration if the UI exposes one
  - id: CFP-03
    criterion: A public CFP portal is reachable without any login and shows event
      branding/name, the submission deadline, and the configured tracks and
      formats as selectable options
    weight: 3
    tags:
      - exists
    scenarios:
      - CFP-S1
      - CFP-S1-PUBLIC
      - CFP-S2
    grader:
      type: llm
    passCriteria: The portal URL loads in a logged-out context showing the event
      name, a visible deadline/close date, and a form (or entry point) whose
      track and format options match the fixture configuration
    evidence: Logged-out screenshot of the portal with event name and deadline;
      screenshot of the open track/format dropdowns showing the fixture options
      (from CFP-S1, or CFP-S2 if the form requires an account first); the
      recorded portal URL observation
  - id: CFP-04
    criterion: "The portal enforces the configured submission window: once the close
      date is in the past, the public portal blocks new submissions with a
      closed state"
    weight: 2
    tags:
      - rule
    scenarios:
      - CFP-S4
    grader:
      type: llm
    passCriteria: After the organizer sets the close date to a past date, the
      logged-out portal shows a closed/'submissions closed' state with no way to
      start or submit a new proposal
    evidence: Screenshot of the close-date setting saved with a past date;
      logged-out screenshot of the portal in its closed state (contrast with the
      open-portal screenshot from CFP-S1)
    checkpoints:
      CFP-S4:
        - closed
  - id: CFP-05
    criterion: A speaker can create a submitter account from the portal, complete
      and submit a proposal, see an on-screen confirmation, and find the
      submission listed with a status in their own dashboard
    weight: 3
    tags:
      - crud
    scenarios:
      - CFP-S2
    grader:
      type: llm
    passCriteria: Account creation succeeds, the 'Taming 40-Minute CI' fixture
      proposal submits, a confirmation state is shown, and the submitter
      dashboard lists the proposal with a status label (Submitted / Under Review
      / Pending or equivalent)
    evidence: Screenshots of the signup step, the filled form pre-submit, the
      confirmation state, and the dashboard row with its status text
    checkpoints:
      CFP-S2:
        - submitted
  - id: CFP-06
    criterion: "Submitted data round-trips to the organizer: the submission appears
      in the organizer's list with title, abstract, track, format, and
      custom-field values intact"
    weight: 3
    tags:
      - roundtrip
    scenarios:
      - CFP-S2
      - CFP-S3
    grader:
      type: llm
    passCriteria: The organizer's submissions list shows both fixture proposals, and
      the detail view of 'Taming 40-Minute CI' shows the same title, track
      'Platform & Infra', format, audience level, and abstract text the speaker
      entered, with no lost or mangled fields
    evidence: Screenshot of the organizer submissions list with both titles;
      screenshot of the submission detail whose field values match the fixture
      data entered in CFP-S2
  - id: CFP-07
    criterion: The public form supports saving an in-progress submission as a draft
      (with as little as a title) and resuming it on return
    weight: 1
    tags:
      - depth
    scenarios:
      - CFP-S2
    grader:
      type: llm
    passCriteria: With only the title entered, a save-as-draft action succeeds, some
      draft indicator is shown, and on returning to the form the draft is
      offered for resume or the saved data is pre-filled
    evidence: Screenshot of the draft banner/indicator after saving; screenshot
      after returning showing the resume prompt or the pre-filled title; agent
      observation if the feature is absent
  - id: CFP-08
    criterion: Submitting a proposal triggers an automated confirmation email to the
      submitter referencing the submission
    weight: 1
    tags:
      - side-effect
    scenarios: []
    grader:
      type: manual
    passCriteria: A confirmation email arrives at the submitter's address within a
      few minutes of submitting, referencing the event and the submitted title;
      if the clone exposes an in-app email log/outbox, a logged message with
      correct recipient and title also passes
    evidence: Screenshot of the received email (or in-app email log entry) showing
      recipient, subject, and the submission title
    manualInstructions: Submit a proposal using an inbox you can inspect (e.g.
      re-run the CFP-S2 submission with a real mailbox address, or use the
      clone's email log/outbox page if it has one). Within a few minutes, verify
      an email arrived that names the event and the submitted talk title.
      Capture a screenshot of the message showing recipient, subject, and title.
      Also note whether the CFP-S2 confirmation screen claimed an email was
      sent.
  - id: CFP-09
    criterion: A submitter can edit an existing submission while the CFP is open,
      and the edited content is what the organizer subsequently sees (inferred
      norm from Sessionize/EasyChair, confirmed by SessionBoard participant
      docs)
    weight: 2
    tags:
      - roundtrip
    scenarios:
      - CFP-S2
      - CFP-S3
    grader:
      type: llm
    passCriteria: "The appended abstract sentence ('Updated: now includes 2026
      benchmark data.') persists across reload in the speaker's view and appears
      verbatim in the organizer's view of the same submission"
    evidence: Speaker-side screenshot of the edited abstract after reload (CFP-S2);
      organizer-side screenshot of the submission detail containing the same
      sentence (CFP-S3)
  - id: CFP-10
    criterion: "Organizer can provision a reviewer (create/invite with usable
      credentials) and the reviewer role is separated from admin: signed in as
      the reviewer, a reviewer-facing dashboard is shown with no organizer/admin
      navigation or capability exposed. Exact assigned-queue scoping ('the queue
      contains exactly the assigned set, nothing else') is deliberately deferred
      to abstract-management's ABS-05 and not scored here."
    weight: 2
    tags:
      - scoping
    scenarios:
      - CFP-S3
    grader:
      type: llm
    passCriteria: Sam Whitfield is created/invited with credentials the agent can
      use, signs in successfully, and lands on a reviewer-facing dashboard that
      exposes no admin navigation or organizer capability. Whether his queue
      contains exactly the assigned submissions is graded once, by ABS-05 — do
      not double-count it here.
    evidence: Screenshot of the reviewer provisioning/invite flow; screenshot of the
      reviewer dashboard signed in as Sam showing a reviewer-scoped view with no
      admin navigation
  - id: CFP-11
    criterion: A reviewer can record a review on an assigned submission (a rating
      plus a text comment) and the recorded review is visible to the organizer,
      with completion state updating on the reviewer dashboard. Scorecard
      field-type depth (numeric/dropdown/free-text criteria editors) is graded
      by abstract-management's ABS-03, not here.
    weight: 2
    tags:
      - roundtrip
    scenarios:
      - CFP-S3
      - CFP-S4
    grader:
      type: llm
    passCriteria: The rating of 4 and the fixture comment are accepted and persist;
      the reviewer dashboard marks the item reviewed/completed; the organizer's
      view of the submission shows the same rating and comment. No scorecard
      field-type variety is required here (see ABS-03).
    evidence: Screenshot of the filled scorecard before submit; screenshot of the
      completed state on the reviewer dashboard; organizer-side screenshot
      (CFP-S4) showing rating 4 and the comment text
  - id: CFP-12
    criterion: Organizer can record accept and reject decisions on submissions, and
      the admin list reflects the distinct decision statuses
    weight: 3
    tags:
      - crud
    scenarios:
      - CFP-S4
    grader:
      type: llm
    passCriteria: "'Taming 40-Minute CI' is marked Accepted and 'Your AI Pair
      Programmer Is Lying to You' is marked Rejected; both statuses persist and
      are shown distinctly in the organizer's submissions list"
    evidence: Screenshot of the decision control being used; screenshot of the
      submissions list showing one Accepted and one Rejected row
    checkpoints:
      CFP-S4:
        - decisions
  - id: CFP-13
    criterion: "Decision statuses propagate to the submitter: the speaker's own
      dashboard reflects Accepted/Rejected for the corresponding proposals"
    weight: 2
    tags:
      - roundtrip
    scenarios:
      - CFP-S4
    grader:
      type: llm
    passCriteria: Signed in as Priya Raman after decisions were recorded, her
      dashboard shows the CI talk as Accepted and the AI talk as Rejected (or
      unambiguous equivalents of those statuses)
    evidence: Screenshot of the speaker dashboard with both status labels visible;
      recorded exact status wording
  - id: CFP-14
    criterion: The platform can send (or queue) acceptance and rejection
      notification emails to decided submitters, with the UI confirming dispatch
    weight: 2
    tags:
      - side-effect
    scenarios:
      - CFP-S4
    grader:
      type: hybrid
      autoShare: 0.5
    passCriteria: "A notify/send-decisions action exists, accepts or provides
      accept/reject templates (merge-field support like
      {speaker_name}/{talk_title} is a plus, inferred), and after triggering it
      the UI reports the messages as sent/queued for the correct recipient sets;
      NOT auto-verified: actual delivery and body personalization"
    evidence: Screenshot of the compose/template step (using the fixture acceptance
      subject/body if offered) and of the sent/queued confirmation,
      per-submission notified indicator, or email log entries
    manualInstructions: After decisions are recorded, trigger the decision
      notifications with submitter addresses that use a real, inspectable inbox.
      Verify one acceptance email and one rejection email arrive, each naming
      the correct talk title (and speaker name if templates support merge
      fields). Screenshot both messages.
  - id: CFP-15
    criterion: An accepted submission becomes available as a session in the
      sessions/agenda area with its metadata (title, speaker, track) intact,
      without re-entering the data
    weight: 2
    tags:
      - handoff
    scenarios:
      - CFP-S4
    grader:
      type: llm
    passCriteria: "After acceptance (plus an explicit convert/move action only if
      the UI requires one), the sessions/agenda area contains a session titled
      'Taming 40-Minute CI: Incremental Builds at Monorepo Scale' with speaker
      Priya Raman and track 'Platform & Infra' carried over with no manual
      re-typing of those fields"
    evidence: Screenshot of the accepted submission detail; screenshot of the
      matching session entry in the sessions/agenda area showing the same title,
      speaker, and track
    checkpoints:
      CFP-S4:
        - handoff
  - id: CFP-16
    criterion: "Submission editing locks after the CFP close date: the speaker can
      no longer modify a submission once the call is closed"
    weight: 2
    tags:
      - rule
    scenarios:
      - CFP-S4
    grader:
      type: llm
    passCriteria: With the close date in the past, the speaker's submission opens
      read-only, hides its edit affordance, or shows an editing-closed message —
      and no edit can be saved
    evidence: Speaker-side screenshot of the locked/read-only submission (or
      editing-closed message), taken after the close date was moved to the past
      — contrast with the successful edit in CFP-S2
    checkpoints:
      CFP-S4:
        - closed
  - id: CFP-17
    criterion: "The app supports more than one event: an organizer can create a
      second event and both events coexist, each reachable via an events list or
      event switcher"
    weight: 2
    tags:
      - exists
    scenarios:
      - CFP-S1
    grader:
      type: llm
    passCriteria: A second event ('Forward Summit 2028') is created and both events
      appear together in an events list or switcher. A single-event app with no
      event-creation or switching UI anywhere fails this item — an agent
      observation naming the places checked is sufficient evidence of absence
    evidence: Screenshot of the events list or switcher showing both events; or the
      agent's explicit observation that no event creation/switching UI exists,
      listing where it looked
  - id: CFP-18
    criterion: "Event data is scoped per event: submissions, sessions and speakers
      belonging to one event do not appear inside another event"
    weight: 2
    tags:
      - scoping
    scenarios:
      - CFP-S1
    grader:
      type: llm
    passCriteria: The second event's submissions/abstracts area is empty (or
      contains only its own records) rather than showing the first event's
      submissions. Cross-event leakage of records is a fail
    evidence: Screenshot of the second event's submissions/abstracts list contrasted
      with the first event's populated list
    manualInstructions: "Only if the agent could not create a second event but the
      app does support multiple events: create two events by hand, add a
      submission to one, and confirm it is not visible from the other."
