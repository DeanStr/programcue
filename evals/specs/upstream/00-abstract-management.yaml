rubric:
  - id: ABS-01
    criterion: Organizer can configure an evaluation plan with two or more
      independent review rounds, each with its own name, open/close dates, and
      its own scorecard, and the configuration persists.
    weight: 3
    tags:
      - crud
    scenarios:
      - ABS-S2
    grader:
      type: llm
    passCriteria: After saving and reloading, both rounds ('Initial Review'
      2026-08-01..2026-10-15 and 'Final Review' 2026-10-16..2026-11-30) are
      listed with visibly distinct names, date ranges, and scorecards; a single
      global review setup with no round concept fails.
    evidence: Screenshot of the reloaded evaluation-plan screen showing both named
      rounds with their differing dates and scorecard contents.
  - id: ABS-02
    criterion: Review rounds can each have their own reviewer pool, so a reviewer
      scoped to round 1 is not automatically a reviewer for round 2.
    weight: 2
    tags:
      - scoping
    scenarios:
      - ABS-S2
    grader:
      type: llm
    passCriteria: The UI attaches reviewers (or a pool/committee) to a specific
      round rather than only globally, and Sam Whitfield could be added to the
      Round 1 pool while Round 2 shows a different (possibly empty) pool.
    evidence: Screenshots of per-round reviewer-pool configuration showing Round 1
      containing Sam Whitfield and Round 2 configured separately; agent
      observation of where reviewer membership is scoped.
  - id: ABS-03
    criterion: The scorecard editor supports numeric rating, dropdown, and free-text
      criteria, and all three field types render on the reviewer side and store
      submitted values.
    weight: 3
    tags:
      - crud
    scenarios:
      - ABS-S2
      - ABS-S3
    grader:
      type: llm
    passCriteria: Organizer could build the round-1 scorecard with numeric
      Originality/Relevance, a Recommendation dropdown (Accept/Maybe/Reject),
      and a Comments text area; the reviewer view rendered all three types; the
      submitted evaluation (values 4, 2, Accept, sample comment) is stored and
      visible after submission.
    evidence: Scorecard-editor screenshot from ABS-S2 plus the filled reviewer
      scorecard and its completed/stored state from ABS-S3.
  - id: ABS-04
    criterion: Scoring criteria can carry weights and the per-submission aggregate
      reflects the weighting (inferred — SessionBoard marketing references
      weighted criteria only for AI personas; aggregation method unspecified).
    weight: 1
    tags:
      - depth
    scenarios:
      - ABS-S2
      - ABS-S3
    grader:
      type: llm
    passCriteria: Weight configuration exists in the scorecard editor and persists
      (Originality weight 2, Relevance weight 1); full credit if the displayed
      aggregate for 'Taming 40-Minute CI' matches the weighted math
      (approximately 3.33 rather than the plain 3.0 average) or is explicitly
      labeled as weighted; no weight concept anywhere fails. If an earlier-area
      review (CFP-S3's all-4s scorecard) is folded into the displayed aggregate,
      judge the arithmetic including it per the agent's recorded observation
      rather than failing the item.
    evidence: Screenshot of the weight configuration in the editor and the
      results-table aggregate value for the submission scored 4 and 2, with the
      agent's recorded arithmetic observation.
  - id: ABS-05
    criterion: Organizer can assign specific submissions to a specific reviewer, and
      the reviewer's queue contains exactly the assigned submissions and nothing
      else.
    weight: 3
    tags:
      - scoping
    scenarios:
      - ABS-S2
      - ABS-S3
    grader:
      type: llm
    passCriteria: Sam Whitfield's queue lists 'Taming 40-Minute CI' and 'Your AI
      Pair Programmer' and does NOT list the unassigned 'Docs That Answer Back';
      a portal that exposes all submissions to every reviewer fails.
    evidence: ABS-S2 assignment-state screenshot plus the ABS-S3 reviewer-queue
      screenshot; agent's recorded list of titles visible in the queue.
  - id: ABS-06
    criterion: Assignment tooling works at scale — at least one of per-reviewer
      caps/limits, auto-distribution of submissions across reviewers, or
      track-filtered bulk assignment is present and functional.
    weight: 2
    tags:
      - bulk
    scenarios:
      - ABS-S2
    grader:
      type: llm
    passCriteria: The assignment UI offers a per-reviewer limit, an
      auto-assign/distribute action, or track/bulk filtering, and the agent
      exercised it without error; assignment strictly one-submission-at-a-time
      with no caps, filters, or auto-distribution fails.
    evidence: Screenshot of the cap setting, auto-distribute control, or track
      filter in use during ABS-S2 step 7, with the agent's observation of what
      happened.
  - id: ABS-07
    criterion: With anonymization enabled on a round, the reviewer's view hides
      author and co-author identity while the organizer's view of the same
      submission shows it.
    weight: 2
    tags:
      - scoping
    scenarios:
      - ABS-S2
      - ABS-S3
    grader:
      type: hybrid
      autoShare: 0.5
    passCriteria: A per-round anonymization/blind setting exists (ABS-S2 step 4) and
      the blinded reviewer view of 'Taming 40-Minute CI' contains none of 'Priya
      Raman', 'Marcus Okafor', or 'Latticework Systems', while the organizer
      view (ABS-S3 step 10) shows them; author names leaking anywhere in the
      reviewer view fails.
    evidence: "Contrasting screenshots: blinded reviewer view vs organizer view of
      the same submission; agent's explicit observation from scanning for the
      three identity strings."
    manualInstructions: "Cross-reviewer isolation needs a second simultaneous
      account: invite a second reviewer you control to the same round, assign
      them 'Taming 40-Minute CI', log in as them in a separate browser, and
      confirm they cannot see Sam Whitfield's scores or comments before
      submitting their own."
  - id: ABS-08
    criterion: A review progress dashboard shows per-reviewer completion counts or
      percentages that match the actual review state in real time.
    weight: 2
    tags:
      - roundtrip
    scenarios:
      - ABS-S2
      - ABS-S3
    grader:
      type: llm
    passCriteria: The dashboard showed Sam Whitfield at 2 assigned / 0 complete
      before any reviews (ABS-S2 step 8) and 2 of 2 complete (or 100%) after
      both evaluations were submitted (ABS-S3 step 11); stale or absent counts
      fail.
    evidence: Before/after progress-dashboard screenshots from the two scenarios
      with matching reviewer name and counts.
  - id: ABS-09
    criterion: Organizer can select reviewers with outstanding reviews and send them
      a bulk reminder from the progress or reviewer view.
    weight: 1
    tags:
      - bulk
    scenarios:
      - ABS-S2
    grader:
      type: hybrid
      autoShare: 0.5
    passCriteria: A reminder/nudge action is available against the lagging reviewer
      (Sam at 0 of 2 complete), and triggering it reports success (confirmation
      toast, sent status, or log entry).
    evidence: Screenshot of the reminder control and the sent confirmation from
      ABS-S2 step 9.
    manualInstructions: Check the sam.reviewer@sbek-test.example.com inbox (or the
      clone's outbound-mail log if it exposes one) and confirm a reminder email
      arrived referencing the pending reviews.
  - id: ABS-10
    criterion: Organizer sees an aggregate score per submission in a results table
      and can sort submissions by that score.
    weight: 3
    tags:
      - roundtrip
    scenarios:
      - ABS-S3
    grader:
      type: llm
    passCriteria: Both reviewed submissions display aggregates consistent with the
      entered scores ('Your AI Pair Programmer' at 5.0 outranking 'Taming
      40-Minute CI' at ~3.0-3.33), and toggling the sort visibly reorders rows
      correctly in both directions; a list with raw per-review data but no
      aggregate or no working sort fails. If an earlier-area review is folded
      into the aggregate (per the agent's recorded arithmetic in step 8), judge
      consistency including that review rather than requiring the exact 3.0/3.33
      values.
    evidence: Results-table screenshots in descending and ascending score order plus
      the agent's recorded row orders and aggregate values.
    checkpoints:
      ABS-S3:
        - aggregates
  - id: ABS-11
    criterion: Co-authors/co-presenters added at submission time persist with their
      role labels and are visible on the submission in organizer-side review and
      results views.
    weight: 2
    tags:
      - crud
    scenarios:
      - ABS-S1
      - ABS-S3
    grader:
      type: llm
    passCriteria: Marcus Okafor appears alongside Priya Raman on 'Taming 40-Minute
      CI' with a role label in the speaker-side detail (ABS-S1) and in the
      organizer's review/results context (ABS-S3 step 10); no co-author support
      at all fails; partial credit if co-authors persist but without role
      labels.
    evidence: Submission-detail screenshots from both scenarios showing the
      participants list with names and roles.
  - id: ABS-12
    criterion: Reviewer can declare a conflict of interest / recuse themselves on an
      assigned submission (inferred — not documented in SessionBoard marketing;
      category norm from peer review tools).
    weight: 1
    tags:
      - depth
    scenarios:
      - ABS-S3
    grader:
      type: llm
    passCriteria: A conflict-of-interest or recusal control is present in the
      reviewer's scoring view (screenshot with wording recorded); full credit if
      exercising it flags the submission or removes it from the reviewer's
      actionable queue.
    evidence: Screenshot of the COI/recuse control from ABS-S3 step 4 and the
      agent's recorded wording; if exercised, the resulting flagged/removed
      state.
  - id: ABS-13
    criterion: Review scores and statuses can be exported to a downloadable file
      (CSV/XLSX) from the results or reports area.
    weight: 2
    tags:
      - side-effect
    scenarios:
      - ABS-S3
    grader:
      type: hybrid
      autoShare: 0.5
    passCriteria: An export/download control exists for review results and
      triggering it initiates a download or reports success without error.
    evidence: Screenshot of the export control and any confirmation/download
      indication from ABS-S3 step 12, plus the recorded filename if shown.
    manualInstructions: Trigger the export yourself, open the downloaded file, and
      verify it contains one row per submission with title, per-criterion or
      aggregate scores, recommendation, and review status matching the on-screen
      results table (Taming 40-Minute CI with Originality 4 / Relevance 2 /
      Accept; Your AI Pair Programmer with 5 / 5 / Accept).
  - id: ABS-14
    criterion: If the clone claims AI-assisted triage, an AI evaluator produces a
      first-pass numeric score with written reasoning on a submission, and a
      human override persists distinguishably.
    weight: 1
    tags:
      - depth
    scenarios:
      - ABS-S2-AI
    grader:
      type: hybrid
      autoShare: 0.5
    passCriteria: An AI evaluation feature exists and yields a numeric score plus
      rationale text attributed to the AI on 'Taming 40-Minute CI'; the results
      view distinguishes AI from human scores; an admin override to a different
      value persists after reload. Judge this item only if the clone claims AI
      review anywhere in its UI or marketing; otherwise score as not applicable
      per the agent's recorded observation of absence.
    evidence: Screenshots of the AI score with its reasoning text, the AI-vs-human
      distinction in results, and the persisted override after reload.
    manualInstructions: Read the AI-generated rationale and confirm it is
      substantive and specific to the abstract's actual content (mentions
      CI/builds/monorepo concepts) rather than generic boilerplate reusable on
      any submission.
