      This independent scenario owns original ABS-S2 step 10 and ABS-S3 step 13.
      Human Initial Review scoring is complete and decisions have not been
      released. Select Initial Review and the CI proposal. Inspect the named
      provider, model and destination before confirming any AI request; opening
      the provider/request confirmation does not send data. Use only the
      configured synthetic evaluation proposal. For production, the project-wide
      instructions carry the operator-authorized fixture payload and Cloudflare
      Workers AI destination; verify those boundaries and the displayed model
      before confirming Generate first pass. Preserve explicit confirmation and
      any automatic approval rejection: report blocked if required authority or
      configuration is unavailable, never bypass it. Record actual generated
      output and a persisted human override, or the precise unavailable
      boundary. Do not release decisions, alter human reviews, change provider
      settings or reset the fixture. AI results remain separately graded and do
      not gate the core workflow.


      ORIGINAL SCENARIO SCRIPT:

      10. If the site advertises AI evaluation / AI triage / AI reviewer
      features, enable
          or run it on "Taming 40-Minute CI" (configuring a persona if required).
          Screenshot any AI-produced score and its written reasoning, plus any
          override control. If no AI feature exists, record that observation.
      13. If AI scores were produced in ABS-S2, verify in the results view that
      the AI
          score is visually distinguishable from human reviewer scores, and if an override
          control exists, override the AI score to a different value, save, reload, and
          screenshot the persisted override.


      Missing optional features are findings: record them and continue the
      reachable script. Use feature_not_found for an absent core capability and
