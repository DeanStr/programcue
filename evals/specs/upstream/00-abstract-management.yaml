      8. Open the review progress dashboard / monitoring view. Screenshot the
      baseline
         state showing Sam Whitfield with 2 assigned and 0 completed (or equivalent
         counts/percentages).
      9. From the progress view (or reviewer list), select the lagging reviewer
      Sam
         Whitfield and trigger the bulk / send-reminder action. Screenshot the
         confirmation that a reminder was sent. Do not expect to verify the email itself.


      Missing optional features are findings: record them and continue the
      reachable script. Use feature_not_found for an absent core capability and
      blocked for unavailable access/evidence. Do not turn provider or
      evidence-tool failures into product verdicts.
    successSignals:
      - Evaluation plan persists two rounds with different names, dates, and
        scorecards after reload
      - Scorecard editor screenshot showing numeric, dropdown, and text fields
