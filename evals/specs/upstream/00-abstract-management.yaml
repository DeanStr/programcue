id: abstract-management
title: Abstract Management (Review Depth & Disposition)
weight: 20
optional: false
description: >
  Abstract management is the review-and-disposition engine that sits behind the
  call for papers. Organizers configure evaluation plans with multiple
  independent review rounds, each carrying its own scorecard (numeric, dropdown,
  and free-text criteria, optionally weighted), its own open/close dates, its
  own anonymization setting, and its own reviewer pool. Submissions are
  distributed to reviewers at scale with per-reviewer caps, auto-distribution or
  track-filtered bulk assignment, and a real-time progress dashboard with bulk
  reminders keeps the committee on schedule. Reviewers score their assigned
  abstracts (blinded when the round requires it, with conflict-of-interest
  recusal where supported), and chairs work from an aggregate score table they
  can sort, export for the committee, and optionally seed with AI first-pass
  triage scores. Basic form building, the submitter portal, and simple
  accept/reject flows are owned by the call-for-papers spec; this spec grades
  the depth of the review workflow itself. Note: a scenario's persona is its
  STARTING identity — scenarios may sign out and switch identities mid-run; the
  harness supplies all fixture credentials to every scenario.
scenarios:
  - id: ABS-S1
    name: Speaker seeds submissions with a co-author
    kind: browser
    persona: speaker
    requiresAuth: true
    allowedPersonas:
      - organizer
      - speaker
      - reviewer
      - anonymous
      - co_speaker
    instructions: >-
      PROGRAMCUE EXECUTION ADAPTATION: Use the configured fixture identities and
      current saved persona. Replace every sign-out/sign-in role transition
      below with switch_persona. For public checks switch to anonymous. Never
      authenticate another identity in the current context. Do not repeat signup
      when already authenticated; explicitly distinguish pre-provisioned access
      from signup evidence.


      Run the chained suite in the new DevFlow Conf 2027 event created by
      CFP-S1, not the populated Future of Events 2027 showcase. After each
      switch_persona, explicitly select DevFlow Conf 2027 through the event
      picker when that role has event access; applicant pages use the observed
      bound CFP URL. Accept the invitation to this event before opening its
      reviewer workspace. Never substitute the showcase's form, schedule,
      reviews or published programme. Fixture emails override literal example
      addresses below. Record actual dates, track/format names and any
      substituted fixture values. Follow the original criterion: substitutions
      cannot hide a missing capability.


      This scenario runs after CFP-S2 and before any review assignment in
      CFP-S3: both original proposals are submitted, editable and undecided, and
      the CFP is open. Reuse them, add and save the co-author on the CI
      proposal, verify that participant persisted after reload, and submit the
      third proposal. Then switch_persona to co_speaker (Marcus), open the bound
      published portalUrl (in the local demo only, complete its explicitly
      labelled no-send email-code fixture as Marcus if the applicant portal
      requires it; do not claim external verification), verify the CI invitation
      under Applications that include you, and explicitly choose Claim speaker
      profile. Verify Marcus’s claimed profile after reload; switch back to
      speaker (Priya), reopen CI and verify that Marcus is now linked to his
      identity, not merely listed with a pending or prepared claim invitation.
      This uses the ordinary authenticated email-matching claim action; fixture
      login alone does not claim the invitation and is not email-verification or
      invitation-delivery evidence. If the claim is unavailable, preserve the
      precise blocker rather than deleting Marcus or attempting acceptance.
      Leave all three undecided. Review assignment locks applicant revisions, so
      complete this setup before switching to review work. Do not release
      decisions, reset the fixture or archive a review cycle.


      Use the bound portalUrl from CFP-S1; verify the record before continuing.


      ORIGINAL SCENARIO SCRIPT:

      1. Navigate to the target site. Find the public call-for-papers /
      submission area —
         it may be called Apply, CFP, Submit a talk, Call for Speakers, Submissions, or
         Proposals, and may live behind the event "DevFlow Conf 2027" if the site hosts
         multiple events. CHAINED-RUN PRECONDITION: if the portal shows a CLOSED state
         (area 01 deliberately closes the CFP at its end), first sign in as the organizer
         Jordan Alvarez (jordan.organizer@sbek-test.example.com, fixture password), move
         the CFP close date back into the future (e.g. 2027-04-30), save, sign out, and
         return here before continuing.
      2. Sign up as the speaker identity Priya Raman
      (priya.speaker@sbek-test.example.com,
         fixture password, title/company/bio from the sample data). If the account already
         exists (e.g. created in area 01), sign in instead.
      3. Ensure the "Taming 40-Minute CI: Incremental Builds at Monorepo Scale"
      proposal
         exists with a co-author. If it already exists from area 01, REUSE it — do not
         submit a duplicate: open it from the speaker dashboard and add the co-author by
         EDITING the existing submission. Otherwise submit it fresh from the sample data
         (format Talk, track Platform & Infra, abstract and audience-level text from the
         fixture). Either way, look for an add co-author / co-presenter / additional
         speaker / participant control. If present, add Marcus Okafor from the sample data
         (marcus.speaker@sbek-test.example.com, Staff Developer Advocate at Cloudreach
         Labs) and assign him a role if role labels are offered (Co-author, Co-speaker,
         Co-presenter, or similar). Screenshot the form or edited submission INCLUDING the
         participants/co-author section before saving/submitting, then screenshot the
         confirmation or saved state. If no co-author control exists anywhere in the flow,
         record that observation explicitly.
      4. Ensure the second proposal "Your AI Pair Programmer Is Lying to You:
      Verification
         Patterns That Scale" exists. If it already exists from area 01 (it may even carry
         a Rejected decision), reuse it as-is — do not submit a duplicate. Otherwise
         submit it from the sample data (Talk, AI Engineering), no co-author.
      5. Submit the third proposal "Docs That Answer Back: Retrieval-Grounded
      Documentation
         Sites" from the sample data (Lightning Talk, Developer Experience), no co-author.
         This is the only proposal guaranteed not to exist yet — always submit it fresh.
      6. Open the speaker's submissions list / dashboard and screenshot it
      showing all
         three submissions with their status labels.
      7. Open the detail view of "Taming 40-Minute CI" and screenshot the
      participants
         list. Record whether Marcus Okafor appears with a role label alongside Priya
         Raman.


      Missing optional features are findings: record them and continue the
      reachable script. Use feature_not_found for an absent core capability and
      blocked for unavailable access/evidence. Do not turn provider or
      evidence-tool failures into product verdicts.
    successSignals:
      - Three submissions visible in the speaker dashboard with status labels
      - Submission detail shows both Priya Raman and Marcus Okafor, each with a
        role label
      - Screenshot of the co-author control in the submission form or edit view
    dependsOn:
