      This scenario owns original steps 1-12; the AI override check in step 13
      runs with AI generation in ABS-S2-AI. In the reviewer queue, open the two
      Assigned entries and verify the Initial Review rubric before scoring.
      Completed CFP Review entries remain available as history; record them
