      ORIGINAL SCENARIO SCRIPT:

      1. Navigate to the target site and find the organizer/admin area — try
      obvious nav
         links first, then routes like /admin, /dashboard, /organizer. Sign up as Jordan
         Alvarez (jordan.organizer@sbek-test.example.com, fixture password) if the site
         has open signup; otherwise sign in with the fixture organizer credentials.
      2. Locate the event "DevFlow Conf 2027". If it does not exist, create it
      from the
         sample data (2027-05-12 to 2027-05-14, Moscone West SF, tracks AI Engineering /
         Platform & Infra / Developer Experience, session formats from the fixture).
      3. Open the submissions/proposals list and confirm the three ABS-S1
      submissions are
         visible. Screenshot the list.
      4. Find the review/evaluation configuration area — it may be called
      Evaluation Plans,
         Review Rounds, Review Workflow, Review Settings, or Scorecards. Create a first
         round named "Initial Review" with open date 2026-08-01 and close date 2026-10-15.
         Enable anonymization / blind review / double-blind for this round if the option
         exists (screenshot the toggle). Build its scorecard with four fields — numeric 1-5
         "Originality", numeric 1-5 "Relevance", dropdown "Recommendation" with options
         Accept / Maybe / Reject, and a long-text "Comments" field. If the editor supports
         per-criterion weights, set Originality to weight 2 and Relevance to weight 1 and
         screenshot the weight configuration; if not, record that weights are unsupported.
         Screenshot the completed scorecard editor.
      5. Create a second round named "Final Review" with open date 2026-10-16
      and close
         date 2026-11-30 and a DIFFERENT scorecard: numeric 1-10 "Final Score" plus a
