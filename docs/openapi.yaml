          changeCursor,
          warnings,
          replayed,
          correlationId,
        ]
      properties:
        submission:
          type: object
          additionalProperties: false
          required: [id, status]
          properties:
            id: { type: string }
            status:
              { type: string, enum: [submitted, assigned, accepted, withdrawn] }
            revision: { type: integer, minimum: 1 }
            directSessionId: { type: [string, "null"] }
        notifications:
          type: array
          maxItems: 21
          items:
            type: object
            additionalProperties: false
            required:
              [operationId, type, idempotencyKey, status, communicationId]
            properties:
              operationId: { type: string }
              type:
                { type: string, enum: [confirmation, co_speaker_invitation] }
              idempotencyKey: { type: string }
              status: { type: string, enum: [queued, queue_failed] }
              communicationId: { type: [string, "null"] }
        webhookDeliveries:
          type: array
          items: { $ref: "#/components/schemas/WebhookDeliverySummary" }
