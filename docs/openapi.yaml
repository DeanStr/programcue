      properties:
        session:
          type: object
          additionalProperties: false
          required: [id, status]
          properties:
            id: { type: string }
            status: { type: string, const: unscheduled }
        replayed: { type: boolean }
        changeCursor: { type: [integer, "null"], minimum: 1 }
        realtimeWarning: { type: [string, "null"] }
        invitationWarning: { type: [string, "null"] }
        webhookDeliveries:
          type: array
          items: { $ref: "#/components/schemas/WebhookDeliverySummary" }
        webhookWarning: { type: [string, "null"] }
