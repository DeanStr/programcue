          items: { $ref: "#/components/schemas/SubmissionTrackSelection" }
      additionalProperties: true
    SubmissionTrackSelection:
      type: object
      additionalProperties: false
      required: [id, name, position]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        position: { type: integer, minimum: 0 }
    AdministrationSubmissionRecord:
      type: object
      required: [id, tracks]
      properties:
        id: { type: string }
        tracks:
          type: array
          items: { $ref: "#/components/schemas/SubmissionTrackSelection" }
      additionalProperties: true
    ParticipantProfile:
      type: object
      additionalProperties: false
      required:
        [
          id,
          email,
          name,
          biography,
          pronunciation,
          organisationName,
          jobTitle,
          profileStatus,
          revision,
          emailVerified,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        biography: { type: [string, "null"] }
        pronunciation: { type: [string, "null"] }
        organisationName: { type: [string, "null"] }
        jobTitle: { type: [string, "null"] }
        profileStatus: { type: string, enum: [draft, published, archived] }
        revision: { type: integer, minimum: 1 }
        emailVerified: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ParticipantProfileResponse:
      type: object
      additionalProperties: false
      required: [profile, correlationId]
      properties:
        profile: { $ref: "#/components/schemas/ParticipantProfile" }
        correlationId: { type: string }
    ParticipantCollectionPage:
      type: object
      additionalProperties: false
