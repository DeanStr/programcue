        - required: [submissions]
        - required: [forms]
        - required: [people]
        - required: [speakers]
        - required: [sessions]
        - required: [scheduleVersions]
        - required: [decisions]
        - required: [communications]
        - required: [resources]
      properties:
        submissions:
          {
            type: array,
            items:
              { $ref: "#/components/schemas/AdministrationSubmissionRecord" },
