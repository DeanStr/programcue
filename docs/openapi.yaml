openapi: 3.1.0
info:
  title: Program Cue API
  version: 0.4.0
  description: Public programme feeds, participant self-service, scoped integration APIs and authenticated event invalidations for Program Cue.
servers:
  - url: /
    description: Current Program Cue deployment
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Check service readiness
      responses:
        "200":
          description: Runtime mode is valid and the D1 baseline schema is reachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          description: Runtime configuration, D1 or the baseline schema is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/public/events/{slug}/programme:
    get:
      operationId: getPublicProgramme
      summary: Retrieve a published event programme
      parameters:
        - $ref: "#/components/parameters/EventSlug"
        - $ref: "#/components/parameters/PublicQuery"
        - $ref: "#/components/parameters/PublicTrack"
        - $ref: "#/components/parameters/PublicRoom"
        - $ref: "#/components/parameters/PublicSpeakerId"
        - $ref: "#/components/parameters/PublicFrom"
        - $ref: "#/components/parameters/PublicTo"
        - name: format
          in: query
          required: false
          description: Download a static snapshot instead of the normal API response.
          schema:
            type: string
            enum: [json, html]
      responses:
        "200":
          description: Published event, schedule version and public sessions, or a static downloadable snapshot when `format` is supplied
          headers:
            Access-Control-Allow-Origin:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProgrammeResponse" }
            text/html:
              schema:
                type: string
                description: Self-contained static programme document returned for `format=html`.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/public/events/{slug}:
    get:
      operationId: getPublicEvent
      summary: Retrieve published event metadata
      description: Returns an event only when it has a current published schedule. The cacheable success body deliberately contains no request-specific correlation value.
      parameters:
        - $ref: "#/components/parameters/EventSlug"
      responses:
        "200":
          description: Published event metadata and publication freshness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicEventResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/public/events/{slug}/sessions:
    get:
      operationId: listPublicSessions
      summary: List published public sessions
      description: Filters the current published collection and returns an opaque cursor bound to its content revision, resource and exact filters. A cursor from changed content or a different query fails with `PUBLICATION_CHANGED` instead of mixing result sets.
      parameters:
        - $ref: "#/components/parameters/EventSlug"
        - $ref: "#/components/parameters/Limit100"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PublicQuery"
        - $ref: "#/components/parameters/PublicTrack"
        - $ref: "#/components/parameters/PublicRoom"
        - $ref: "#/components/parameters/PublicSpeakerId"
        - $ref: "#/components/parameters/PublicFrom"
        - $ref: "#/components/parameters/PublicTo"
      responses:
        "200":
          description: Published session page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSessionPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Cursor belongs to a replaced publication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/public/events/{slug}/speakers:
    get:
      operationId: listPublicSpeakers
      summary: List speakers with published public profiles
      parameters:
        - $ref: "#/components/parameters/EventSlug"
        - $ref: "#/components/parameters/Limit100"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PublicQuery"
        - in: query
          name: sessionId
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Published speaker page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSpeakerPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Cursor belongs to a replaced publication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/public/events/{slug}/schedule:
    get:
      operationId: listPublicSchedule
      summary: List current published schedule entries
      parameters:
        - $ref: "#/components/parameters/EventSlug"
        - $ref: "#/components/parameters/Limit100"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PublicQuery"
        - $ref: "#/components/parameters/PublicTrack"
        - $ref: "#/components/parameters/PublicRoom"
        - $ref: "#/components/parameters/PublicSpeakerId"
        - $ref: "#/components/parameters/PublicFrom"
        - $ref: "#/components/parameters/PublicTo"
      responses:
        "200":
          description: Published schedule entry page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSchedulePage" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Cursor belongs to a replaced publication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/public/events/{slug}/calendar.ics:
    get:
      operationId: getPublicProgrammeCalendar
      summary: Download the published programme as iCalendar
      parameters:
        - $ref: "#/components/parameters/EventSlug"
      responses:
        "200":
          description: Published iCalendar programme feed
          headers:
            Access-Control-Allow-Origin:
              schema: { type: string }
          content:
            text/calendar:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/events/{eventId}:
    get:
      operationId: getEvent
      summary: Retrieve an authorised event
      description: Requires an event-authorised API key with the `events:read` scope.
      x-required-api-key-scope: events:read
      security: [{ apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
      responses:
        "200":
          description: Tenant-isolated event record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateEventResponse" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/events/{eventId}/participant/{resource}:
    get:
      operationId: getParticipantResource
      summary: Read the authenticated participant's event records
      description: >-
        Requires an authenticated browser session with an accepted speaker or
        submitter membership in the exact URL event. Profile, applications,
        sessions, private file metadata and tasks are restricted to the signed-in
        person; no current-event cookie or default event is used. Collection
        resources use opaque keyset cursors and a maximum page size of 100.
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ParticipantResource"
        - $ref: "#/components/parameters/Limit100"
        - $ref: "#/components/parameters/Cursor"
        - in: query
          name: status
          description: Optional submission status filter; rejected for other resources.
          schema:
            type: string
            enum:
              [
                draft,
                submitted,
                assigned,
                in_review,
                decision_ready,
                accepted,
                waitlisted,
                rejected,
                withdrawn,
              ]
      responses:
        "200":
          description: The participant profile or a cursor-paginated own-record collection
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/ParticipantResourceResponse" }
        "401": { $ref: "#/components/responses/SessionUnauthorised" }
        "403": { $ref: "#/components/responses/SessionForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    patch:
      operationId: updateParticipantProfile
      summary: Update the authenticated participant's profile
      description: >-
        Supported only when `resource=profile`. Requires an exact same-origin
        browser request, optimistic profile revision and an Idempotency-Key.
        The participant identity, event boundary and audit actor come from the
        authenticated session and cannot be supplied in the body.
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/ParticipantResource"
        - $ref: "#/components/parameters/ParticipantIdempotencyKey"
        - $ref: "#/components/parameters/ExactOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParticipantProfilePatch" }
      responses:
        "200":
          description: Profile updated or an exact retry replayed
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/ParticipantProfileCommandResponse",
                }
        "401": { $ref: "#/components/responses/SessionUnauthorised" }
        "403": { $ref: "#/components/responses/SessionForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/events/{eventId}/participant/submissions/{submissionId}/{command}:
    post:
      operationId: runParticipantSubmissionCommand
      summary: Submit or withdraw an owned application
      description: >-
        Requires an exact same-origin authenticated browser request, explicit
        confirmation and an Idempotency-Key. The command resolves the form and
        verified primary submitter from the owned URL-event submission, then uses
        the same revision, validation, audit, notification and workflow service as
        the browser application flow. Co-speakers may read a claimed submission but
        cannot submit or withdraw it.
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - in: path
          name: submissionId
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - $ref: "#/components/parameters/ParticipantSubmissionCommand"
        - $ref: "#/components/parameters/ParticipantIdempotencyKey"
        - $ref: "#/components/parameters/ExactOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/ParticipantSubmitCommand"
                - $ref: "#/components/schemas/ParticipantWithdrawCommand"
      responses:
        "200":
          description: Command committed or an exact retry replayed; durably recorded downstream delivery degradation is reported in warnings, while an unrecorded effect remains recoverable through exact retry
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/ParticipantSubmissionCommandResponse",
                }
        "401": { $ref: "#/components/responses/SessionUnauthorised" }
        "403": { $ref: "#/components/responses/SessionForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/events/{eventId}/participant/tasks/{taskId}/complete:
    post:
      operationId: completeParticipantTask
      summary: Complete an owned participant task
      description: >-
        Requires an exact same-origin authenticated browser request from the
        task owner or a participant related to the task target. The optimistic
        task revision, evidence requirements and dependencies are revalidated
        by the task service. Exact retries return the durable canonical task
        state; an in-progress command fails explicitly instead of being run twice.
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - in: path
          name: taskId
          required: true
          schema: { type: string, minLength: 1, maxLength: 300 }
        - $ref: "#/components/parameters/ParticipantIdempotencyKey"
        - $ref: "#/components/parameters/ExactOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ParticipantTaskCompletionRequest" }
      responses:
        "200":
          description: Task completed or an exact retry replayed
          content:
            application/json:
              schema:
                {
                  $ref: "#/components/schemas/ParticipantTaskCompletionResponse",
                }
        "401": { $ref: "#/components/responses/SessionUnauthorised" }
        "403": { $ref: "#/components/responses/SessionForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/events/{eventId}/administration/{family}/{itemId}/{command}:
    post:
      operationId: runAdministrationCommand
      summary: Run a versioned administration command
      description: >-
        Requires an exact same-origin owner or administrator browser session;
        committee chairs may additionally draft or release decisions. Supported
        family/command pairs are forms save|publish, people invite, memberships
        revoke, sessions edit|archive|restore, decisions draft|release,
        task-templates save, task-assignments assign, resources save|publish,
        integration-connections connect|disconnect, integration-mappings
        save|delete, and webhook-endpoints save|status|test|rotate-secret.
        Use itemId=new only for create commands. Consequential commands claim a
        durable actor-scoped intent before mutation or provider work; exact
        retries replay their stored canonical result and unresolved processing
        claims fail explicitly. Webhook-secret commands replay only while that
        secret remains current; retrying a superseded secret returns a conflict
        instead of disclosing rotated credentials.
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - in: path
          name: family
          required: true
          schema: { $ref: "#/components/schemas/AdministrationFamily" }
        - in: path
          name: itemId
          required: true
          schema: { type: string, minLength: 1, maxLength: 300 }
        - in: path
          name: command
          required: true
          schema: { $ref: "#/components/schemas/AdministrationCommand" }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/ExactOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AdministrationFormSaveRequest"
                - $ref: "#/components/schemas/AdministrationFormPublishRequest"
                - $ref: "#/components/schemas/AdministrationPersonInvitationRequest"
                - $ref: "#/components/schemas/AdministrationMembershipRevocationRequest"
                - $ref: "#/components/schemas/AdministrationSessionEditRequest"
                - $ref: "#/components/schemas/AdministrationSessionLifecycleRequest"
                - $ref: "#/components/schemas/AdministrationDecisionRequest"
                - $ref: "#/components/schemas/AdministrationTaskTemplateRequest"
                - $ref: "#/components/schemas/AdministrationTaskAssignmentRequest"
                - $ref: "#/components/schemas/AdministrationResourceSaveRequest"
                - $ref: "#/components/schemas/AdministrationResourcePublishRequest"
                - $ref: "#/components/schemas/AdministrationIntegrationConnectionRequest"
                - $ref: "#/components/schemas/AdministrationIntegrationDisconnectRequest"
                - $ref: "#/components/schemas/AdministrationIntegrationMappingRequest"
                - $ref: "#/components/schemas/AdministrationIntegrationMappingDeleteRequest"
                - $ref: "#/components/schemas/AdministrationWebhookEndpointRequest"
                - $ref: "#/components/schemas/AdministrationWebhookStatusRequest"
                - $ref: "#/components/schemas/AdministrationWebhookTestRequest"
                - $ref: "#/components/schemas/AdministrationWebhookRotateSecretRequest"
      responses:
        "200":
          description: Command committed or its durable canonical result replayed
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdministrationCommandResponse" }
        "401": { $ref: "#/components/responses/SessionUnauthorised" }
        "403": { $ref: "#/components/responses/SessionForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503":
          description: A required provider, credential, queue or runtime binding is unavailable; no provider success is fabricated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/events/{eventId}/sessions/direct:
    post:
      operationId: createDirectSession
      summary: Create an unscheduled session directly
      description: >-
        Requires an event-authorised API key with `sessions:write` and an
        Idempotency-Key. The configured event format and optional default duration
        are revalidated, people are matched by normalised email, resource
        acknowledgements are materialised, and the API-key actor is audited without
        synthesising a human person.
      x-required-api-key-scope: sessions:write
      security: [{ apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectSessionCommand" }
      responses:
        "201":
          description: Direct session created or an exact retry replayed
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/DirectSessionCommandResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/events/{eventId}/{resource}:
    get:
      operationId: listAdministrationResource
      summary: List an authorised administration resource
      description: >-
        Lists submissions, forms, people, speakers, sessions, schedule versions,
        decisions, communications or resources. Each value requires its matching
        least-privilege `*:read` scope. Unknown and repeated query parameters are
        rejected; supported filters depend on the selected resource.
      security: [{ apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/AdminResource"
        - $ref: "#/components/parameters/Limit100"
        - $ref: "#/components/parameters/Cursor"
        - in: query
          name: q
          schema: { type: string, minLength: 1, maxLength: 160 }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: formId
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: kind
          schema: { type: string, enum: [submission, direct_session] }
        - in: query
          name: profileStatus
          schema: { type: string, enum: [draft, published, archived] }
        - in: query
          name: role
          description: Event membership role filter; supported only for people.
          schema:
            type: string
            enum:
              [
                owner,
                administrator,
                committee_chair,
                evaluator,
                submitter,
                speaker,
              ]
        - in: query
          name: visibility
          schema: { type: string, enum: [public, private, hidden] }
        - in: query
          name: trackId
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: decision
          schema: { type: string, enum: [accepted, rejected, waitlisted] }
        - in: query
          name: submissionId
          description: Submission filter for moderation records.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: targetType
          description: Assignment, review or conflict target kind.
          schema: { type: string, enum: [submission, session] }
        - in: query
          name: targetId
          description: Assignment, review or conflict target identifier.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: channel
          schema: { type: string, enum: [email, sms, push, calendar] }
        - in: query
          name: category
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: Cursor-paginated administration collection with RFC 3339 timestamps
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdministrationCollectionPage" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/events/{eventId}/{resource}/{itemId}:
    get:
      operationId: getAdministrationItem
      summary: Retrieve one authorised administration record and bounded related records
      description: >-
        Supports submissions, forms, people, speakers, sessions, schedule versions,
        decisions, communications and resources. The API key must carry the selected
        resource's least-privilege read scope; the item and every related row are
        constrained to the URL event and key organisation.
      security: [{ apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/AdminResource"
        - in: path
          name: itemId
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Tenant-isolated administration item and its resource-specific related records
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AdministrationItemResponse" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/events/{eventId}/evaluation/{resource}:
    get:
      operationId: listEvaluationResource
      summary: List event evaluation state
      description: Requires the `evaluation:read` scope. Returns plans, teams, rounds with rubric criteria, round reviewer pools, assignments, reviews, conflicts or moderation records.
      x-required-api-key-scope: evaluation:read
      security: [{ apiKeyAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/EvaluationResource"
        - $ref: "#/components/parameters/Limit100"
        - $ref: "#/components/parameters/Cursor"
        - in: query
          name: q
          schema: { type: string, minLength: 1, maxLength: 160 }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: planId
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: roundId
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: submissionId
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: evaluatorPersonId
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: teamId
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Cursor-paginated private evaluation collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvaluationCollectionPage" }
        "401": { $ref: "#/components/responses/Unauthorised" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/events/{eventId}/evaluation/me/{command}:
    post:
      operationId: runEvaluationPersonCommand
      summary: Save assigned review work or run an authorised evaluation decision command
      description: >-
        Authenticates the real person from the browser session in the exact URL event;
        reviewer and moderator identity is never accepted from the request and is never
        synthesised for an API key. The evaluation service enforces assignment, role,
        revision, state and finality boundaries. Review submission and reopening also
        persist idempotently keyed webhook events.
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/EvaluationPersonCommand"
        - $ref: "#/components/parameters/ExactOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/EvaluationPersonCommandRequest" }
      responses:
        "200":
          description: Evaluation command committed under the authenticated human actor
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/EvaluationPersonCommandResponse" }
        "401": { $ref: "#/components/responses/SessionUnauthorised" }
        "403": { $ref: "#/components/responses/SessionForbidden" }
