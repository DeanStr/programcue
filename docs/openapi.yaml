        biography: { type: string, maxLength: 5000, default: "" }
    ParticipantUploadReference:
      type: object
      additionalProperties: false
      required: [assetId, versionId]
      properties:
        assetId: { type: string, minLength: 1, maxLength: 180 }
        versionId: { type: string, minLength: 1, maxLength: 180 }
    ParticipantSubmitCommand:
      type: object
      additionalProperties: false
      required: [confirmed, revision, answers, speakers]
      properties:
        confirmed: { type: boolean, const: true }
        revision: { type: integer, minimum: 0 }
        answers:
          type: object
          maxProperties: 50
          propertyNames: { type: string, pattern: "^[a-z][a-z0-9_]{1,39}$" }
          additionalProperties:
            oneOf:
              - { type: string, maxLength: 5000 }
              - type: array
                maxItems: 30
