  /api/webhooks/file-scanner:
    post:
      operationId: reconcileFileScannerResult
      summary: Reconcile a signed malware-scanner result
      description: >-
        Authenticates the unmodified request body with the configured HMAC secret,
        bounded callback identifier and five-minute timestamp window before parsing
        strict JSON. Clean bytes are released only when the quarantined R2 object still
        matches the committed upload; callback identifiers and scan state make exact
        retries idempotent.
      parameters:
        - in: header
          name: X-Program-Cue-Scanner-Id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 160
            pattern: "^[a-zA-Z0-9._:-]+$"
        - in: header
          name: X-Program-Cue-Scanner-Timestamp
          required: true
          description: Unix epoch seconds within five minutes of the receiver clock.
          schema: { type: string, pattern: "^\\d{10}$" }
        - in: header
          name: X-Program-Cue-Scanner-Signature
          required: true
          description: Base64 HMAC-SHA256 over `callbackId.timestamp.rawBody`, prefixed with `v1,`.
          schema: { type: string, pattern: "^v1,.+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FileScannerCallbackRequest" }
      responses:
        "200":
          description: Scan state committed or an exact callback retry acknowledged
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/FileScannerCallbackResponse" }
        "400":
          description: Authenticated body is invalid JSON or contains an unsupported scanner result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookError" }
        "401":
          description: Scanner callback identifier, timestamp or HMAC signature is missing, stale or invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookError" }
        "404":
          description: File version does not exist in the supplied event
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookError" }
        "409":
          description: File state changed or conflicts with an earlier scan result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookError" }
        "413":
          description: Scanner callback body exceeds 128 KB
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookError" }
        "415":
          description: Authenticated callback Content-Type is not application/json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookError" }
        "503":
          description: FILE_SCANNER_WEBHOOK_SECRET is unavailable or invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookError" }

  /api/webhooks/resend:
    post:
      operationId: reconcileResendDelivery
      summary: Reconcile a signed Resend delivery event
      description: The unmodified request body is authenticated with the required Svix headers before delivery state is applied idempotently. `RESEND_WEBHOOK_SECRET` is required.
      parameters:
        - $ref: "#/components/parameters/SvixId"
        - $ref: "#/components/parameters/SvixTimestamp"
        - $ref: "#/components/parameters/SvixSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendWebhook" }
      responses:
        "200":
          description: Delivery reconciled or a duplicate provider event acknowledged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookResult" }
        "503":
          description: Resend webhook configuration is unavailable, or the signed provider event arrived before its local delivery was available; retry it
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [error]
                properties:
                  error: { type: string }
        "400": { $ref: "#/components/responses/WebhookBadRequest" }
        "401": { $ref: "#/components/responses/WebhookUnauthorised" }
        "413": { $ref: "#/components/responses/WebhookPayloadTooLarge" }
        "415":
          description: Authenticated webhook Content-Type is not application/json
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookError" }

  /admin/events/{eventId}/changes:
    get:
      operationId: readEventChanges
      summary: Poll event changes or upgrade to an event WebSocket
      description: >-
        Requires an authenticated owner or administrator browser session. Without an
        `Upgrade: websocket` header this returns authoritative D1 cursor pages. With the
        upgrade header it returns `101 Switching Protocols`; WebSocket messages are
        invalidation summaries only and clients must reload authoritative server data.
      security: [{ sessionAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/EventId"
        - in: query
          name: cursor
          description: Last event change sequence observed by the client.
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - in: header
          name: Upgrade
          required: false
          schema: { type: string, const: websocket }
      responses:
        "101":
          description: WebSocket upgrade accepted; the channel emits ready and event-change messages
        "200":
          description: Authoritative bounded event-change cursor page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventChangePage" }
        "401": { description: Browser authentication is required }
        "403":
          {
            description: The authenticated person may not administer this event,
          }
        "404": { description: Event not found }
        "422": { description: cursor or limit is invalid }
        "426": { description: WebSocket upgrade expected by the live transport }
        "503":
          {
            description: EVENT_CHANNEL binding is unavailable for a requested WebSocket upgrade,
          }

components:
  securitySchemes:
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: Program Cue API key
      description: Organisation- or event-scoped Program Cue API key. Keys are hashed at rest, permission-limited, expirable and revocable.
    sessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: Authenticated Program Cue browser session; the deployed authentication layer controls the concrete cookie name.

  parameters:
    EventSlug:
      in: path
      name: slug
      required: true
      schema: { type: string, minLength: 1 }
    EventId:
      in: path
      name: eventId
      required: true
      schema: { type: string, minLength: 1 }
    AdminResource:
      in: path
      name: resource
      required: true
      schema:
        type: string
        enum:
          [
            submissions,
            forms,
            people,
            speakers,
            sessions,
            schedule-versions,
            decisions,
            communications,
            resources,
          ]
    ParticipantResource:
      in: path
      name: resource
      required: true
      schema:
        type: string
        enum: [profile, submissions, sessions, files, tasks]
    ParticipantSubmissionCommand:
      in: path
      name: command
      required: true
      schema: { type: string, enum: [submit, withdraw] }
    EvaluationResource:
      in: path
      name: resource
      required: true
      schema:
        type: string
        enum:
          [plans, teams, rounds, round-reviewers, assignments, reviews, conflicts, moderations]
    EvaluationPersonCommand:
      in: path
      name: command
      required: true
      schema: { type: string, enum: [review, conflict, moderation, reopen] }
    CommunicationCommand:
      in: path
      name: command
      required: true
      schema: { type: string, enum: [preview, send, schedule, test] }
    OperationCommand:
      in: path
      name: command
      required: true
      schema: { type: string, enum: [retry, retry-item, cancel] }
    IntegrationResource:
      in: path
      name: resource
      required: true
      schema:
        type: string
        enum: [connections, mappings, runs, run-items]
    Limit100:
      in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Limit200:
      in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
    Cursor:
      in: query
      name: cursor
      required: false
      description: Opaque continuation cursor returned by the previous page
      schema: { type: string, minLength: 1, maxLength: 512 }
    PublicQuery:
      in: query
      name: q
      required: false
      schema: { type: string, minLength: 1, maxLength: 160 }
    PublicTrack:
      in: query
      name: track
      required: false
      schema: { type: string, minLength: 1, maxLength: 120 }
    PublicRoom:
      in: query
      name: room
      required: false
      schema: { type: string, minLength: 1, maxLength: 120 }
    PublicSpeakerId:
      in: query
      name: speakerId
      required: false
      schema: { type: string, minLength: 1, maxLength: 200 }
    PublicFrom:
      in: query
      name: from
      required: false
      description: Inclusive RFC 3339 session start boundary
      schema: { type: string, format: date-time }
    PublicTo:
      in: query
      name: to
      required: false
      description: Exclusive RFC 3339 session start boundary
      schema: { type: string, format: date-time }
    TaskCursor:
      in: query
      name: cursor
      required: false
      description: Opaque continuation cursor returned by the previous task page
      schema: { type: string, minLength: 1, maxLength: 512 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Stable retry key scoped to the authorised actor, event and operation. Exact retries replay the durable result and reuse with a different request is rejected; retention follows the owning command's durable history policy.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    ParticipantIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: Stable retry key scoped to the authenticated person, URL event and concrete participant command. Exact retries replay the stored response; reuse with a different request is rejected.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    ExactOrigin:
      in: header
      name: Origin
      required: true
      description: Must exactly equal the API request origin for cookie-authenticated mutations.
      schema: { type: string, format: uri }
    SvixId:
      in: header
      name: svix-id
      required: true
      schema: { type: string, minLength: 1 }
    SvixTimestamp:
      in: header
      name: svix-timestamp
      required: true
      schema: { type: string, minLength: 1 }
    SvixSignature:
      in: header
      name: svix-signature
      required: true
      schema: { type: string, minLength: 1 }

  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [ok, service, environment, sourceRevision, correlationId]
      properties:
        ok: { type: boolean, const: true }
        service: { type: string, const: program-cue }
        environment: { type: string }
        sourceRevision:
          type: string
          description: Non-secret deployed source revision used to correlate runtime behavior with a build.
          example: 3f6a2c1
        correlationId: { type: string }

    PublicProgrammeResponse:
      $ref: "#/components/schemas/PublicProgramme"
    PublicationSummary:
      type: object
      additionalProperties: false
      required: [id, versionNumber]
      properties:
        id: { type: string }
        versionNumber: { type: integer, minimum: 1 }
    PublicEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          slug,
          name,
          timezone,
          startDate,
          endDate,
          venue,
          city,
          description,
          brandAccent,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        timezone: { type: string, description: IANA timezone identifier }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        venue: { type: [string, "null"] }
        city: { type: [string, "null"] }
        description: { type: [string, "null"] }
        brandAccent: { type: string }
    PublicEventResponse:
      type: object
      additionalProperties: false
      required: [event, publication, freshness]
      properties:
        event: { $ref: "#/components/schemas/PublicEvent" }
        publication:
          type: object
          additionalProperties: false
          required: [id, versionNumber, publishedAt]
          properties:
            id: { type: string }
            versionNumber: { type: integer, minimum: 1 }
            publishedAt: { type: string, format: date-time }
        freshness: { $ref: "#/components/schemas/ProgrammeFreshness" }
    PublicProgramme:
      type: object
      additionalProperties: false
      required: [event, version, sessions, speakers, freshness]
      properties:
        event:
          type: object
          additionalProperties: false
          required:
            [
              id,
              slug,
              name,
              timezone,
              startDate,
              endDate,
              venue,
              city,
              description,
              brandAccent,
            ]
          properties:
            id: { type: string }
            slug: { type: string }
            name: { type: string }
            timezone: { type: string }
            startDate:
              {
                type: string,
                format: date,
                description: First event calendar date in the event timezone,
              }
            endDate:
              {
                type: string,
                format: date,
                description: Last event calendar date in the event timezone,
              }
            venue: { type: [string, "null"] }
            city: { type: [string, "null"] }
            description: { type: [string, "null"] }
            brandAccent: { type: string }
        version:
          type: object
          additionalProperties: false
          required: [id, versionNumber, publishedAt]
          properties:
            id: { type: string }
            versionNumber: { type: integer, minimum: 1 }
            publishedAt: { type: string, format: date-time }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/PublicSession" }
        speakers:
          type: array
          items: { $ref: "#/components/schemas/PublicSpeaker" }
        freshness:
          $ref: "#/components/schemas/ProgrammeFreshness"
    PublicSession:
      type: object
      additionalProperties: false
      required:
        [
          id,
          slug,
          title,
          description,
          format,
          startsAt,
          endsAt,
          room,
          building,
          level,
          track,
          speakerIds,
          speakerNames,
        ]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        format: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        room: { type: string }
        building: { type: [string, "null"] }
        level: { type: [string, "null"] }
        track: { type: [string, "null"] }
        speakerIds:
          type: array
          items: { type: string }
        speakerNames:
          type: array
          items: { type: string }
    PublicSpeaker:
      type: object
      additionalProperties: false
      required:
        [
          id,
          displayName,
          imageUrl,
          biography,
          pronunciation,
          organisationName,
          jobTitle,
          sessionIds,
        ]
      properties:
        id: { type: string }
        displayName: { type: string }
        imageUrl: { type: [string, "null"] }
        biography: { type: [string, "null"] }
        pronunciation: { type: [string, "null"] }
        organisationName: { type: [string, "null"] }
        jobTitle: { type: [string, "null"] }
        sessionIds:
          type: array
          items: { type: string }
    ProgrammeFreshness:
      type: object
      additionalProperties: false
      required: [source, fetchedAt, cacheExpiresAt, cached]
      properties:
        source: { type: string, enum: [d1, airtable] }
        fetchedAt: { type: string, format: date-time }
        cacheExpiresAt: { type: [string, "null"], format: date-time }
        cached: { type: boolean }

    PublicSessionPage:
      type: object
      additionalProperties: false
      required: [sessions, nextCursor, publication, freshness]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/PublicSession" }
        nextCursor: { type: [string, "null"] }
        publication: { $ref: "#/components/schemas/PublicationSummary" }
        freshness: { $ref: "#/components/schemas/ProgrammeFreshness" }
    PublicSpeakerPage:
      type: object
      additionalProperties: false
      required: [speakers, nextCursor, publication, freshness]
      properties:
        speakers:
          type: array
          items: { $ref: "#/components/schemas/PublicSpeaker" }
        nextCursor: { type: [string, "null"] }
        publication: { $ref: "#/components/schemas/PublicationSummary" }
        freshness: { $ref: "#/components/schemas/ProgrammeFreshness" }
    PublicSchedulePage:
      type: object
      additionalProperties: false
      required: [entries, nextCursor, publication, timezone, freshness]
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/PublicSession" }
        nextCursor: { type: [string, "null"] }
        publication: { $ref: "#/components/schemas/PublicationSummary" }
        timezone: { type: string, description: IANA timezone identifier }
        freshness: { $ref: "#/components/schemas/ProgrammeFreshness" }

    PrivateEventResponse:
      type: object
      additionalProperties: false
      required: [event, correlationId]
      properties:
        event:
          type: object
          additionalProperties: true
          required: [id, name, slug, timezone, startsAt, endsAt, revision]
          properties:
            id: { type: string }
            name: { type: string }
            slug: { type: string }
            timezone: { type: string }
            startsAt: { type: string, format: date-time }
            endsAt: { type: string, format: date-time }
            revision: { type: integer, minimum: 1 }
        correlationId: { type: string }
    ApiRecord:
      type: object
