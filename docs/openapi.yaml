        speakers:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ParticipantSpeakerInput" }
        uploads:
          type: object
          maxProperties: 1
          default: {}
          propertyNames: { type: string, pattern: "^[a-z][a-z0-9_]{1,39}$" }
