          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        people:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        speakers:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        sessions:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        scheduleVersions:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        decisions:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        communications:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        resources:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        nextCursor: { type: [string, "null"] }
        correlationId: { type: string }
    AdministrationItemResponse:
      type: object
      additionalProperties: false
      required: [item, related, relatedHasMore, correlationId]
      properties:
        item: { $ref: "#/components/schemas/ApiRecord" }
        related:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/ApiRecord" }
        relatedHasMore:
          type: boolean
          description: True when the item has more than the bounded 200 related records.
        correlationId: { type: string }
    EvaluationCollectionPage:
      type: object
      additionalProperties: false
      required: [nextCursor, correlationId]
      anyOf:
        - required: [plans]
        - required: [teams]
        - required: [rounds]
        - required: [assignments]
        - required: [reviews]
        - required: [conflicts]
        - required: [moderations]
      properties:
        plans:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        teams:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        rounds:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        assignments:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        reviews:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        conflicts:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        moderations:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        nextCursor: { type: [string, "null"] }
        correlationId: { type: string }
    EvaluationPersonCommandRequest:
      oneOf:
        - $ref: "#/components/schemas/EvaluationReviewCommand"
        - $ref: "#/components/schemas/EvaluationConflictCommand"
        - $ref: "#/components/schemas/EvaluationModerationCommand"
        - $ref: "#/components/schemas/EvaluationReopenCommand"
    EvaluationReviewCommand:
      type: object
      additionalProperties: false
      required:
        [
          assignmentId,
          revision,
          scores,
          recommendation,
          confidence,
          submitterFeedback,
          privateNotes,
          intent,
        ]
      properties:
        assignmentId: { type: string, minLength: 1, maxLength: 200 }
        revision: { type: integer, minimum: 0 }
        scores:
          type: object
          maxProperties: 50
          propertyNames: { type: string, minLength: 1, maxLength: 100 }
          additionalProperties:
            oneOf:
              - { type: string, maxLength: 8000 }
              - { type: number }
              - { type: boolean }
        recommendation:
          type: [string, "null"]
          enum:
            [accept, minor_changes, conditional_accept, waitlist, reject, null]
        confidence: { type: [integer, "null"], minimum: 1, maximum: 5 }
        submitterFeedback: { type: string, maxLength: 8000 }
        privateNotes: { type: string, maxLength: 8000 }
        intent: { type: string, enum: [save, submit] }
      description: recommendation and confidence must be non-null when intent is submit.
    EvaluationConflictCommand:
      type: object
      additionalProperties: false
      required: [assignmentId, reason]
      properties:
        assignmentId: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 10, maxLength: 2000 }
    EvaluationModerationCommand:
      type: object
      additionalProperties: false
      required:
        [
          roundId,
          submissionId,
          expectedModerationId,
          recommendation,
          moderatedScore,
          notes,
          status,
          confirmed,
        ]
      properties:
        roundId: { type: string, minLength: 1, maxLength: 200 }
        submissionId: { type: string, minLength: 1, maxLength: 200 }
        expectedModerationId:
          { type: [string, "null"], minLength: 1, maxLength: 200 }
        recommendation:
          { type: string, enum: [accept, waitlist, reject, advance] }
        moderatedScore: { type: [number, "null"], minimum: 1, maximum: 5 }
        notes: { type: string, minLength: 1, maxLength: 8000 }
        status: { type: string, enum: [draft, confirmed] }
        confirmed: { type: boolean }
    EvaluationReopenCommand:
      type: object
      additionalProperties: false
      required: [assignmentId, reason, confirmed]
      properties:
        assignmentId: { type: string, minLength: 1, maxLength: 200 }
        reason: { type: string, minLength: 10, maxLength: 2000 }
        confirmed: { type: boolean, const: true }
    EvaluationPersonCommandResponse:
      type: object
      additionalProperties: false
      required: [changeCursor, realtimeWarning, correlationId]
      anyOf:
        - required:
            [
              reviewId,
              revision,
              weightedScore,
              nextAssignmentId,
              webhookDeliveries,
              webhookWarning,
            ]
        - required: [assignmentId, status]
        - required: [moderationId, status]
        - required: [reviewId, revision, webhookDeliveries, webhookWarning]
      properties:
        reviewId: { type: string }
        revision: { type: integer, minimum: 1 }
        weightedScore: { type: [number, "null"] }
        nextAssignmentId: { type: [string, "null"] }
        assignmentId: { type: string }
        moderationId: { type: string }
        status: { type: string, enum: [recused, draft, confirmed] }
        changeCursor: { type: [integer, "null"], minimum: 1 }
        realtimeWarning: { type: [string, "null"] }
        webhookDeliveries:
          type: array
          items: { $ref: "#/components/schemas/WebhookDeliverySummary" }
        webhookWarning: { type: [string, "null"] }
        correlationId: { type: string }
    IntegrationCollectionPage:
      type: object
      additionalProperties: false
      required: [nextCursor, correlationId]
      anyOf:
        - required: [connections]
        - required: [mappings]
        - required: [runs]
        - required: [runItems]
      properties:
        connections:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        mappings:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        runs: { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        runItems:
          { type: array, items: { $ref: "#/components/schemas/ApiRecord" } }
        nextCursor: { type: [string, "null"] }
        correlationId: { type: string }
    CommunicationCommandRequest:
      oneOf:
        - $ref: "#/components/schemas/CommunicationPreviewRequest"
        - $ref: "#/components/schemas/CommunicationSendRequest"
        - $ref: "#/components/schemas/CommunicationScheduleRequest"
        - $ref: "#/components/schemas/CommunicationTestRequest"
    CommunicationPreviewRequest:
      type: object
      additionalProperties: false
      required: [templateVersionId, audienceType, kind]
      properties:
        templateVersionId: { type: string, format: uuid }
        audienceType:
          type: string
          enum:
            [
              submitted_applicants,
              decision_recipients,
              accepted_speakers,
              incomplete_speakers,
              due_speakers,
              overdue_speakers,
              event_administrators,
              manual,
            ]
        manualRecipients: { type: string, maxLength: 20000, default: "" }
        kind: { type: string, enum: [transactional, optional] }
    CommunicationSendRequest:
      type: object
      additionalProperties: false
      required:
        [
          templateVersionId,
          audienceType,
          idempotencyKey,
          recipientFingerprint,
          deliverableFingerprint,
          suppressedCount,
          kind,
        ]
      properties:
        templateVersionId: { type: string, format: uuid }
        audienceType:
          type: string
          enum:
            [
              submitted_applicants,
              decision_recipients,
              accepted_speakers,
              incomplete_speakers,
              due_speakers,
              overdue_speakers,
              event_administrators,
              manual,
            ]
        manualRecipients: { type: string, maxLength: 20000, default: "" }
        kind: { type: string, enum: [transactional, optional] }
        idempotencyKey: { type: string, minLength: 8, maxLength: 128 }
        recipientFingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        deliverableFingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        suppressedCount: { type: integer, minimum: 0 }
    CommunicationScheduleRequest:
      type: object
      additionalProperties: false
      required:
        [
          templateVersionId,
          audienceType,
          idempotencyKey,
          recipientFingerprint,
          deliverableFingerprint,
          suppressedCount,
          scheduledAt,
          kind,
        ]
      properties:
        templateVersionId: { type: string, format: uuid }
        audienceType:
          type: string
          enum:
            [
              submitted_applicants,
              decision_recipients,
              accepted_speakers,
              incomplete_speakers,
              due_speakers,
              overdue_speakers,
              event_administrators,
              manual,
            ]
        manualRecipients: { type: string, maxLength: 20000, default: "" }
        kind: { type: string, enum: [transactional, optional] }
        idempotencyKey: { type: string, minLength: 8, maxLength: 128 }
        recipientFingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        deliverableFingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
        suppressedCount: { type: integer, minimum: 0 }
        scheduledAt:
          type: integer
          minimum: 1
          description: Unix timestamp at least 60 seconds in the future.
    CommunicationTestRequest:
      type: object
      additionalProperties: false
      required: [templateVersionId, recipient, idempotencyKey]
      properties:
        templateVersionId: { type: string, format: uuid }
        recipient: { type: string, format: email }
        idempotencyKey: { type: string, minLength: 8, maxLength: 128 }
    CommunicationCommandResponse:
      type: object
      additionalProperties: false
      required: [result, correlationId]
      properties:
        result:
          oneOf:
            - $ref: "#/components/schemas/CommunicationPreview"
            - $ref: "#/components/schemas/CommunicationCommandResult"
        correlationId: { type: string }
    CommunicationPreview:
      type: object
      additionalProperties: false
      required: [template, recipients, confirmation, rendered, provider]
      properties:
        template: { type: object, additionalProperties: true }
        recipients:
          type: object
          additionalProperties: false
          required: [selected, deliverable, invalid, suppressed]
          properties:
            selected: { type: integer, minimum: 0, maximum: 5000 }
            deliverable:
              {
                type: array,
                maxItems: 5000,
                items: { type: object, additionalProperties: true },
              }
            invalid:
              {
                type: array,
                maxItems: 5000,
                items: { type: object, additionalProperties: true },
              }
            suppressed:
              {
                type: array,
                maxItems: 5000,
                items: { type: object, additionalProperties: true },
              }
        confirmation:
          type: object
          additionalProperties: false
          required:
            [recipientFingerprint, deliverableFingerprint, suppressedCount]
          properties:
            recipientFingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
            deliverableFingerprint: { type: string, pattern: "^[0-9a-f]{64}$" }
            suppressedCount: { type: integer, minimum: 0 }
        rendered:
          type: object
          additionalProperties: false
          required: [subject, html, text]
          properties:
            subject: { type: string }
            html: { type: string }
            text: { type: string }
        provider:
          type: object
          additionalProperties: false
          required: [configured, sender, queueConfigured]
          properties:
            configured: { type: boolean }
            sender: { type: [string, "null"] }
            queueConfigured: { type: boolean }
    CommunicationCommandResult:
      type: object
      additionalProperties: false
      required:
        [communicationId, operationId, status, operationStatus, duplicate]
      properties:
        communicationId: { type: string }
        operationId: { type: [string, "null"] }
        status: { type: string, enum: [scheduled, queued] }
        operationStatus: { type: [string, "null"], enum: [queued, null] }
        duplicate: { type: boolean }
    OperationCommandRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [confirmed]
          properties:
            confirmed: { type: boolean, const: true }
        - type: object
          additionalProperties: false
          required: [confirmed, itemId]
          properties:
            confirmed: { type: boolean, const: true }
            itemId: { type: string, minLength: 1, maxLength: 200 }
    OperationCommandResponse:
      type: object
      additionalProperties: false
      required: [operationId, status, correlationId]
      properties:
        operationId: { type: string }
        itemId: { type: string }
        status: { type: string, enum: [queued, cancelled] }
        correlationId: { type: string }
    EvaluationCriterionInput:
      type: object
      additionalProperties: false
      required: [id, name, inputType, weightPercent, required, position]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500, default: "" }
        inputType:
          {
            type: string,
            enum: [scale_5, scale_10, yes_no, free_text, dropdown],
          }
        options:
          type: array
          maxItems: 100
          default: []
          items: { type: string, minLength: 1, maxLength: 120 }
        weightPercent: { type: integer, minimum: 0, maximum: 100 }
        required: { type: boolean }
        position: { type: integer, minimum: 0 }
    EvaluationRoundInput:
      type: object
      additionalProperties: false
      required: [id, name, anonymous, scorecardId, scorecardVersion, criteria]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 120 }
        opensAt: { type: [string, "null"], format: date-time }
        closesAt: { type: [string, "null"], format: date-time }
        dueAt: { type: [string, "null"], format: date-time }
        anonymous: { type: boolean }
        scorecardId: { type: string, minLength: 1, maxLength: 120 }
        scorecardVersion: { type: integer, minimum: 1 }
        criteria:
          type: array
          minItems: 1
          maxItems: 30
          items: { $ref: "#/components/schemas/EvaluationCriterionInput" }
    EvaluationPlanCommand:
      type: object
      additionalProperties: false
      required: [revision, name, status, decisionRole, rounds]
      properties:
        revision: { type: integer, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [draft, active, closed] }
        decisionRole: { type: string, enum: [administrator, committee_chair] }
        rounds:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/EvaluationRoundInput" }
    EvaluationNextRoundCommand:
      type: object
      additionalProperties: false
      required: [planId, planRevision, name, cloneRoundId]
      properties:
        planId: { type: string, minLength: 1, maxLength: 200 }
        planRevision: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        opensAt: { type: [string, "null"], format: date-time }
        closesAt: { type: [string, "null"], format: date-time }
        dueAt: { type: [string, "null"], format: date-time, default: null }
        anonymous: { type: boolean }
        scorecardId:
          { type: [string, "null"], minLength: 1, maxLength: 120 }
        scorecardVersion: { type: integer, minimum: 1 }
        cloneRoundId: { type: string, minLength: 1, maxLength: 200 }
    EvaluationAssignmentCommand:
      type: object
      additionalProperties: false
      required: [roundId, targetType, targetIds]
      properties:
        roundId: { type: string, minLength: 1, maxLength: 200 }
        targetType: { type: string, enum: [submission, session] }
        targetIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        evaluatorPersonIds:
          type: array
          maxItems: 100
          uniqueItems: true
          default: []
          items: { type: string, minLength: 1, maxLength: 200 }
        teamId:
          {
            type: [string, "null"],
            minLength: 1,
            maxLength: 200,
            default: null,
          }
      description: Supply either at least one evaluatorPersonId or one teamId, never both.
    EvaluationAdvanceCommand:
      type: object
      additionalProperties: false
      required:
        [
          fromRoundId,
          fromRoundRevision,
          toRoundId,
          toRoundRevision,
          submissionIds,
          confirmed,
        ]
      properties:
        fromRoundId: { type: string, minLength: 1, maxLength: 200 }
        fromRoundRevision: { type: integer, minimum: 1 }
        toRoundId: { type: string, minLength: 1, maxLength: 200 }
        toRoundRevision: { type: integer, minimum: 1 }
        submissionIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 200 }
        evaluatorPersonIds:
          type: array
          maxItems: 100
          uniqueItems: true
          default: []
          items: { type: string, minLength: 1, maxLength: 200 }
        teamId:
          {
            type: [string, "null"],
            minLength: 1,
            maxLength: 200,
            default: null,
          }
        confirmed: { type: boolean, const: true }
    EvaluationPlanCommandResponse:
      type: object
      additionalProperties: false
      required: [planId, correlationId]
      properties:
        planId: { type: string }
        correlationId: { type: string }
    EvaluationRoundCommandResponse:
      type: object
      additionalProperties: false
      required: [roundId, correlationId]
      properties:
        roundId: { type: string }
        correlationId: { type: string }
    EvaluationAssignmentCommandResponse:
      type: object
      additionalProperties: false
      required:
        [
          createdAssignmentCount,
          requestedAssignmentCount,
          undoOperationId,
          undoExpiresAt,
          correlationId,
        ]
      properties:
        createdAssignmentCount: { type: integer, minimum: 0 }
        requestedAssignmentCount: { type: integer, minimum: 1 }
        undoOperationId: { type: [string, "null"] }
        undoExpiresAt: { type: [string, "null"], format: date-time }
        correlationId: { type: string }
    EvaluationRoundReviewerCommand:
      type: object
      additionalProperties: false
      required: [roundId, personId, operation]
      description: Set `confirmed` to true when removing a reviewer. The response reports the exact number of unfinished assignments cancelled.
      properties:
        roundId: { type: string, minLength: 1, maxLength: 200 }
        personId: { type: string, minLength: 1, maxLength: 200 }
        operation: { type: string, enum: [add, remove] }
        confirmed: { type: boolean, const: true }
    EvaluationRoundReviewerCommandResponse:
      type: object
      additionalProperties: false
      required:
        [roundId, personId, operation, cancelledAssignmentCount, correlationId]
      properties:
        roundId: { type: string }
        personId: { type: string }
        operation: { type: string, enum: [add, remove] }
        cancelledAssignmentCount: { type: integer, minimum: 0 }
        correlationId: { type: string }
    EvaluationAdvanceCommandResponse:
      type: object
      additionalProperties: false
      required:
        [
          advancedSubmissionCount,
          assignmentCount,
          webhookDeliveries,
          webhookWarning,
          correlationId,
        ]
      properties:
        advancedSubmissionCount: { type: integer, minimum: 1 }
        assignmentCount: { type: integer, minimum: 1 }
        webhookDeliveries:
          type: array
          items: { $ref: "#/components/schemas/WebhookDeliverySummary" }
        webhookWarning: { type: [string, "null"] }
        correlationId: { type: string }
    AcceleventsExportRequest:
      type: object
      additionalProperties: false
      required: [connectionId, dryRun]
      properties:
        connectionId: { type: string, minLength: 1, maxLength: 200 }
        dryRun: { type: boolean }
        previewFingerprint:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Required when `dryRun` is false; use the fingerprint returned by the approved dry run.
      allOf:
        - if:
            properties:
              dryRun: { const: false }
            required: [dryRun]
          then:
            required: [previewFingerprint]
    IntegrationRunCommandResponse:
      type: object
      additionalProperties: false
      required:
        [
          runId,
          operationId,
          queued,
          replayed,
          previewFingerprint,
          correlationId,
        ]
      properties:
        runId: { type: string }
        operationId: { type: [string, "null"] }
        queued: { type: boolean }
        replayed: { type: boolean }
        previewFingerprint:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Exact mapping and connection fingerprint recorded for this run.
        correlationId: { type: string }

    Operation:
      type: object
      additionalProperties: false
      required:
        [
          id,
          type,
          status,
          idempotencyKey,
          operationCorrelationId,
          progressTotal,
          progressCompleted,
          progressFailed,
          attemptCount,
          lastError,
          createdAt,
          updatedAt,
          completedAt,
        ]
      properties:
        id: { type: string }
        type: { type: string }
        status: { type: string }
        idempotencyKey: { type: string }
        operationCorrelationId: { type: string }
        progressTotal: { type: [integer, "null"], minimum: 0 }
        progressCompleted: { type: integer, minimum: 0 }
        progressFailed: { type: integer, minimum: 0 }
        attemptCount: { type: integer, minimum: 0 }
        lastError: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        completedAt: { type: [string, "null"], format: date-time }

    TaskCreateRequest:
      type: object
      additionalProperties: false
      required: [title, targetType, targetId, taskType, impact]
      properties:
        title: { type: string, minLength: 3, maxLength: 200 }
        description: { type: [string, "null"], maxLength: 2000, default: null }
        targetType: { type: string, enum: [speaker, session, event] }
        targetId: { type: string, minLength: 1, maxLength: 200 }
        ownerPersonId:
          {
            type: [string, "null"],
            minLength: 1,
            maxLength: 200,
            default: null,
          }
        taskType: { $ref: "#/components/schemas/TaskType" }
        impact: { $ref: "#/components/schemas/TaskImpact" }
        dueAt:
          {
            type: [string, "null"],
            format: date-time,
            default: null,
            description: RFC 3339 timestamp,
          }
        dependencyIds:
          type: array
          maxItems: 100
          uniqueItems: true
          default: []
          items: { type: string, minLength: 1, maxLength: 200 }
    TaskItemResponse:
      type: object
      additionalProperties: false
      required: [task, correlationId]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        correlationId: { type: string }
    Task:
      type: object
      additionalProperties: false
      required:
        [
          id,
          templateId,
          targetType,
          targetId,
          ownerPersonId,
          ownerName,
          title,
          description,
          taskType,
          impact,
          status,
          readinessState,
          readinessPercent,
          revision,
          dueAt,
          evidenceJson,
          waiverJson,
          submittedAt,
          completedAt,
          createdAt,
          updatedAt,
          dependencyIds,
        ]
      properties:
        id: { type: string }
        templateId: { type: [string, "null"] }
        targetType: { type: string, enum: [speaker, session, event] }
        targetId: { type: string }
        ownerPersonId: { type: [string, "null"] }
        ownerName: { type: [string, "null"] }
        title: { type: string }
        description: { type: [string, "null"] }
        taskType: { $ref: "#/components/schemas/TaskType" }
        impact: { $ref: "#/components/schemas/TaskImpact" }
        status:
          {
            type: string,
            enum:
              [
                not_started,
                in_progress,
                blocked,
                submitted,
                completed,
                waived,
                overdue,
              ],
          }
        readinessState:
          { type: string, enum: [on_track, at_risk, blocked, overdue] }
        readinessPercent: { type: integer, minimum: 0, maximum: 100 }
        revision: { type: integer, minimum: 1 }
        dueAt: { type: [string, "null"], format: date-time }
        evidenceJson: { type: [string, "null"] }
        waiverJson: { type: [string, "null"] }
        submittedAt: { type: [string, "null"], format: date-time }
        completedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        dependencyIds:
          type: array
          items: { type: string }
    TaskType:
      type: string
      enum:
        [
          checklist,
          acknowledgement,
          short_form,
          file_upload,
          link_visit,
          administrator_only,
        ]
    TaskImpact:
      type: string
      enum: [critical, high, medium, low]

    SchedulePublishRequest:
      type: object
      additionalProperties: false
      required: [scheduleVersionId, scheduleRevision]
      properties:
        scheduleVersionId: { type: string, minLength: 1, maxLength: 200 }
        scheduleRevision: { type: integer, minimum: 1 }

    SchedulePublishResponse:
      type: object
      additionalProperties: false
      required:
        [
          published,
          scheduleVersionId,
          changeCursor,
          realtimeWarning,
          calendar,
          correlationId,
        ]
      properties:
        published: { type: boolean, const: true }
        scheduleVersionId: { type: string }
        changeCursor: { type: [integer, "null"], minimum: 1 }
        realtimeWarning: { type: [string, "null"] }
        calendar: { $ref: "#/components/schemas/CalendarFanoutSummary" }
        correlationId: { type: string }

    CalendarFanoutSummary:
      type: object
      additionalProperties: false
      required: [operationId, status, dispatchError]
      properties:
        operationId: { type: string }
        status: { type: string, enum: [queued, queue_failed] }
        dispatchError: { type: [string, "null"] }

    ResendWebhook:
      type: object
      required: [type, data]
